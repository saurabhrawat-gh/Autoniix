server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Scrape stdout/stderr of every container in the compose project via the
  # Docker socket. Labels are derived from container name + compose service.
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service
      - source_labels: ["__meta_docker_container_label_com_docker_compose_project"]
        target_label: project
    pipeline_stages:
      - docker: {}
      # Try to parse structlog JSON (every Python service uses structlog with
      # JSON renderer in production). Non-JSON lines pass through unchanged.
      - json:
          expressions:
            level: level
            event: event
            content_id: content_id
            channel_id: channel_id
            phase: phase
        drop_malformed: false
      - labels:
          level:
          phase:
