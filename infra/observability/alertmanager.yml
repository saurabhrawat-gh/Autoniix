global:
  resolve_timeout: 5m
  # Alertmanager does not expand environment variables in this file. The Slack
  # webhook is mounted as a secret from SLACK_WEBHOOK_URL (see docker-compose).
  slack_api_url_file: /run/secrets/slack_webhook_url

route:
  receiver: "slack-default"
  group_by: ["alertname", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    # Critical alerts page immediately with shorter repeat
    - receiver: "slack-critical"
      match:
        severity: critical
      group_wait: 10s
      repeat_interval: 1h

    # Low-priority info alerts go to a separate (quieter) channel
    - receiver: "slack-info"
      match:
        severity: info
      repeat_interval: 24h

receivers:
  - name: "slack-default"
    slack_configs:
      - channel: "#yt-alerts"
        send_resolved: true
        title: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *Service:* {{ .Labels.service | default "unknown" }}
          *Summary:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          {{ end }}

  - name: "slack-critical"
    slack_configs:
      - channel: "#yt-alerts-critical"
        send_resolved: true
        title: "🔴 CRITICAL: {{ .CommonLabels.alertname }}"
        text: >-
          {{ range .Alerts }}
          *Service:* {{ .Labels.service | default "unknown" }}
          *Summary:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          {{ end }}

  - name: "slack-info"
    slack_configs:
      - channel: "#yt-alerts"
        send_resolved: false
        title: "ℹ️ {{ .CommonLabels.alertname }}"
        text: >-
          {{ range .Alerts }}
          {{ .Annotations.summary }}
          {{ end }}

inhibit_rules:
  # Suppress warning-level alerts when critical is already firing for the same service
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ["service"]
