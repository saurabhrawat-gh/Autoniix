# nginx config used by the socket-proxy sidecar.
# Why: Traefik's Docker SDK pins API path to /v1.24/* on every request and
# Docker 26+ daemons reject API < 1.40. This nginx rewrites the version
# prefix on the fly so the daemon sees /v1.43/* (well within its support).
#
# Used by service `socket-proxy` in docker-compose.yml (TLS profile).

# Run as root so the worker can read /var/run/docker.sock (root:docker, 0660).
user root;

events {}

http {
  upstream docker_sock {
    server unix:/var/run/docker.sock;
  }

  server {
    listen 2375;

    # Rewrite any /v1.X[Y] prefix to /v1.43 before forwarding.
    location ~ ^/v1\.[0-9]+(/.*)?$ {
      rewrite ^/v1\.[0-9]+(/.*)?$ /v1.43$1 break;
      proxy_pass http://docker_sock;
      proxy_set_header Host docker;
      proxy_http_version 1.1;
    }

    # Unversioned endpoints (/_ping, /version, /info, /events) pass through.
    location / {
      proxy_pass http://docker_sock;
      proxy_set_header Host docker;
      proxy_http_version 1.1;
    }
  }
}
