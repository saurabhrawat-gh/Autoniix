name: autoniix

networks:
  autoniix-net:
    name: autoniix-net    # disable compose's project-name prefix so Traefik label "autoniix-net" matches
    driver: bridge

volumes:
  pg_app_data:
  pg_temporal_data:
  redis_data:
  minio_data:
  remotion_tmp:
  remotion_bundle_cache:
  prometheus_data:
  grafana_data:
  loki_data:
  letsencrypt_data:

services:

  # Databases
  postgres-app:
    # Pinned via versions.env POSTGRES_IMAGE=pgvector/pgvector:pg15
    # Must match every CI job + scripts/ci-local.sh.
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: ${DB_NAME:-autoniix}
      POSTGRES_USER: ${DB_USER:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me_strong_random_64}
    volumes:
      - pg_app_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./scripts/seed-data.sql:/docker-entrypoint-initdb.d/02-seed.sql
    ports:
      - "127.0.0.1:5433:5432"
    networks: [autoniix-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-app} -d ${DB_NAME:-autoniix}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres-temporal:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: temporal
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${TEMPORAL_DB_PASSWORD:-change_me_temporal_64}
    volumes:
      - pg_temporal_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    networks: [autoniix-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: sh -c "redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru $${REDIS_PASSWORD:+--requirepass $$REDIS_PASSWORD}"
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6380:6379"
    networks: [autoniix-net]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ${REDIS_PASSWORD:+-a $REDIS_PASSWORD} ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    networks: [autoniix-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # MinIO bootstrap (one-shot)
  # Creates the bucket on first boot and applies a download policy to the
  # `public/` prefix (used for assets that must be fetched directly by
  # YouTube / browsers without presigning, e.g. thumbnails). Idempotent.
  minio-bootstrap:
    image: minio/mc:latest
    networks: [autoniix-net]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-autoniix}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        until mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" >/dev/null 2>&1; do
          echo 'waiting for minio...'; sleep 2
        done
        mc mb -p local/"$$S3_BUCKET" 2>/dev/null || true
        # Public-read on the whole bucket (local dev / CI only — production uses S3/R2 with IAM).
        # This covers thumbnails (public/*), renders (test/renders/* and prod/renders/*),
        # and any other key prefix so the E2E test can download without credentials.
        mc anonymous set download local/"$$S3_BUCKET" 2>/dev/null || true
        echo 'minio bootstrap complete'
    restart: "no"

  # Secrets backend (Infisical)
  # Optional. Enabled when SECRETS_BACKEND=infisical (default: env).
  # The dashboard-bff and workers read provider credentials from here
  # via src/providers/secrets.py. If this service is down the chain
  # falls back to env, so the stack still boots cleanly.
  infisical:
    image: infisical/infisical:latest-postgres
    profiles: ["secrets"]
    environment:
      ENCRYPTION_KEY: ${INFISICAL_ENCRYPTION_KEY}
      AUTH_SECRET: ${INFISICAL_AUTH_SECRET}
      DB_CONNECTION_URI: postgres://${DB_USER:-app}:${DB_PASSWORD:-change_me_strong_random_64}@postgres-app:5432/infisical?sslmode=disable
      REDIS_URL: redis://redis:6379/3
      SITE_URL: http://localhost:8222
      TELEMETRY_ENABLED: "false"
    ports:
      - "127.0.0.1:8222:8080"
    networks: [autoniix-net]
    depends_on:
      postgres-app:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  # Temporal
  temporal:
    image: temporalio/auto-setup:latest
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=${TEMPORAL_DB_PASSWORD:-change_me_temporal_64}
      - POSTGRES_SEEDS=postgres-temporal
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/production.yaml
    volumes:
      - ./config/dynamicconfig:/etc/temporal/config/dynamicconfig
    ports:
      - "127.0.0.1:7233:7233"
    networks: [autoniix-net]
    depends_on:
      postgres-temporal:
        condition: service_healthy
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:latest
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:8080,https://${TEMPORAL_DOMAIN:-temporal.localhost}
    ports:
      - "127.0.0.1:8080:8080"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.temporal.rule=Host(`${TEMPORAL_DOMAIN:-temporal.localhost}`)"
      - "traefik.http.routers.temporal.entrypoints=websecure"
      - "traefik.http.routers.temporal.tls.certresolver=letsencrypt"
      - "traefik.http.routers.temporal.middlewares=admin-auth@docker,secureHeaders@file"
      - "traefik.http.services.temporal.loadbalancer.server.port=8080"
    networks: [autoniix-net]
    depends_on:
      - temporal
    restart: unless-stopped

  # Application Services
  research:
    build: .
    command: uvicorn src.services.research.main:app --host 0.0.0.0 --port 8001
    env_file: .env
    environment:
      - PORT=8001
      - SENTENCE_TRANSFORMERS_HOME=/app/.cache/sentence_transformers
    ports:
      - "127.0.0.1:8001:8001"
    networks: [autoniix-net]
    depends_on:
      postgres-app: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 1536M } } }

  script:
    build: .
    command: uvicorn src.services.script.main:app --host 0.0.0.0 --port 8002
    env_file: .env
    environment:
      - PORT=8002
    ports:
      - "127.0.0.1:8002:8002"
    networks: [autoniix-net]
    depends_on:
      postgres-app: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 1536M } } }

  voice:
    build: .
    command: uvicorn src.services.voice.main:app --host 0.0.0.0 --port 8003
    env_file: .env
    environment:
      - PORT=8003
    ports:
      - "127.0.0.1:8003:8003"
    networks: [autoniix-net]
    depends_on:
      postgres-app: { condition: service_healthy }
      minio: { condition: service_healthy }
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 768M } } }

  assets:
    build: .
    command: uvicorn src.services.assets.main:app --host 0.0.0.0 --port 8004
    env_file: .env
    environment:
      - PORT=8004
    ports:
      - "127.0.0.1:8004:8004"
    networks: [autoniix-net]
    depends_on:
      postgres-app: { condition: service_healthy }
      minio: { condition: service_healthy }
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 512M } } }

  thumbnail:
    build: .
    command: uvicorn src.services.thumbnail.main:app --host 0.0.0.0 --port 8005
    env_file: .env
    environment:
      - PORT=8005
    ports:
      - "127.0.0.1:8005:8005"
    networks: [autoniix-net]
    depends_on:
      postgres-app: { condition: service_healthy }
      minio: { condition: service_healthy }
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 768M } } }

  assembly:
    build: .
    command: uvicorn src.services.assembly.main:app --host 0.0.0.0 --port 8006
    env_file: .env
    environment:
      - PORT=8006
    ports:
      - "127.0.0.1:8006:8006"
    networks: [autoniix-net]
    depends_on:
      postgres-app: { condition: service_healthy }
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 512M } } }

  delivery:
    build: .
    command: uvicorn src.services.delivery.main:app --host 0.0.0.0 --port 8007
    env_file: .env
    environment:
      - PORT=8007
    ports:
      - "127.0.0.1:8007:8007"
    networks: [autoniix-net]
    depends_on:
      postgres-app: { condition: service_healthy }
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 256M } } }

  analytics:
    build: .
    command: uvicorn src.services.analytics.main:app --host 0.0.0.0 --port 8008
    env_file: .env
    environment:
      - PORT=8008
    ports:
      - "127.0.0.1:8008:8008"
    networks: [autoniix-net]
    depends_on:
      postgres-app: { condition: service_healthy }
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 512M } } }

  admin:
    build: .
    command: uvicorn src.services.admin.main:app --host 0.0.0.0 --port 8009
    env_file: .env
    environment:
      - PORT=8009
    ports:
      - "127.0.0.1:8009:8009"
    networks: [autoniix-net]
    depends_on:
      postgres-app: { condition: service_healthy }
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 256M } } }

  direction:
    build: .
    command: uvicorn src.services.direction.main:app --host 0.0.0.0 --port 8010
    env_file: .env
    environment:
      - PORT=8010
    ports:
      - "127.0.0.1:8010:8010"
    networks: [autoniix-net]
    depends_on:
      postgres-app: { condition: service_healthy }
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 512M } } }

  brand:
    build: .
    command: uvicorn src.services.brand.main:app --host 0.0.0.0 --port 8012
    env_file: .env
    environment:
      - PORT=8012
    ports:
      - "127.0.0.1:8012:8012"
    networks: [autoniix-net]
    depends_on:
      postgres-app: { condition: service_healthy }
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 512M } } }

  # Brain Service — AE-P1 Adaptive Decision Engine.
  # Consumes pipeline.video.complete / failed events from Redis, runs pattern
  # analysis, writes brain_decisions rows, and publishes brain.directive events.
  # Starts in advisory-only mode (brain.advisory_mode=TRUE); flip to FALSE to
  # enable enforcement. Health + decision API on port 8015.
  brain:
    build: .
    command: python -m src.services.brain.main
    env_file: .env
    environment:
      - BRAIN_PORT=8015
      - BRAIN_RESOLVER_INTERVAL_S=3600
    ports:
      - "127.0.0.1:8015:8015"
    networks: [autoniix-net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8015/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      postgres-app: { condition: service_healthy }
      redis: { condition: service_healthy }
      temporal: { condition: service_started }
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 256M } } }

  editor:
    build: .
    command: uvicorn src.services.editor.main:app --host 0.0.0.0 --port 8013
    env_file: .env
    environment:
      - PORT=8013
    ports:
      - "127.0.0.1:8013:8013"
    networks: [autoniix-net]
    depends_on:
      postgres-app: { condition: service_healthy }
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 512M } } }

  sheets-sync:
    build: .
    command: uvicorn src.services.sheets_sync.main:app --host 0.0.0.0 --port 8011
    env_file: .env
    environment:
      - PORT=8011
    ports:
      - "127.0.0.1:8011:8011"
    networks: [autoniix-net]
    depends_on:
      postgres-app: { condition: service_healthy }
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 256M } } }

  # Finishing pipeline — Phase 1B DaVinci Resolve headless service (AE-295).
  # Stub implementation: accepts jobs via POST /jobs and returns them as completed.
  # Replace _run_job in services/resolve-finisher/app.py with real Resolve CLI
  # when hardware is available. Set FINISHING_SERVICE_URL=http://resolve-finisher:8014
  # in .env to route finishing traffic here (requires require_resolve_finish=true per channel).
  resolve-finisher:
    build: { context: ./services/resolve-finisher }
    environment:
      - PORT=8014
    ports:
      - "127.0.0.1:8014:8014"
    networks: [autoniix-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8014/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 256M } } }

  # Remotion Renderer
  remotion-api:
    build: { context: ./services/remotion, dockerfile: Dockerfile }
    command: ["npm", "run", "start:api"]
    environment:
      - NODE_ENV=production
      - API_PORT=4000
      - LOG_LEVEL=info
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RENDER_CONCURRENCY=1
      - RENDER_TMP_DIR=/app/tmp
      - S3_ENDPOINT=http://minio:9000
      - S3_REGION=auto
      - S3_BUCKET=${S3_BUCKET:-autoniix}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_KEY:-minioadmin}
      - S3_PUBLIC_BASE_URL=${S3_PUBLIC_BASE_URL:-http://minio:9000/autoniix}
      - S3_FORCE_PATH_STYLE=true
      - S3_KEY_PREFIX=prod
    ports:
      - "127.0.0.1:4000:4000"
    networks: [autoniix-net]
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 2G } } }

  remotion-worker:
    build: { context: ./services/remotion, dockerfile: Dockerfile }
    command: ["npm", "run", "start:worker"]
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RENDER_CONCURRENCY=1
      - RENDER_TMP_DIR=/app/tmp
      - S3_ENDPOINT=http://minio:9000
      - S3_REGION=auto
      - S3_BUCKET=${S3_BUCKET:-autoniix}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_KEY:-minioadmin}
      - S3_PUBLIC_BASE_URL=${S3_PUBLIC_BASE_URL:-http://minio:9000/autoniix}
      - S3_FORCE_PATH_STYLE=true
      - S3_KEY_PREFIX=prod
    volumes:
      - remotion_tmp:/app/tmp
    networks: [autoniix-net]
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 4G } } }

  # Remotion Vision: tier-aware workers (P0.11)
  # Off by default. Enable with `docker compose --profile vision up`.
  remotion-worker-tier1:
    profiles: ["vision"]
    build:
      context: ./services/remotion
      dockerfile: Dockerfile
    command: ["npm", "run", "start:worker"]
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
      - WORKER_ROLE=tier1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RENDER_CONCURRENCY=2
      - RENDER_TMP_DIR=/app/tmp
      - DIFF_CACHE_ENABLED=true
      - BUNDLE_CACHE_DIR=/bundle-cache
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=${S3_BUCKET:-autoniix}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_KEY:-minioadmin}
      - S3_FORCE_PATH_STYLE=true
      - S3_KEY_PREFIX=prod
    volumes:
      - remotion_tmp:/app/tmp
      - remotion_bundle_cache:/bundle-cache
    networks: [autoniix-net]
    depends_on:
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 4G } } }

  remotion-worker-tier2:
    profiles: ["vision"]
    build:
      context: ./services/remotion
      dockerfile: Dockerfile
    command: ["npm", "run", "start:worker"]
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
      - WORKER_ROLE=tier2
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RENDER_CONCURRENCY=4
      - RENDER_TMP_DIR=/app/tmp
      - DIFF_CACHE_ENABLED=true
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=${S3_BUCKET:-autoniix}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_KEY:-minioadmin}
      - S3_FORCE_PATH_STYLE=true
      - S3_KEY_PREFIX=prod
    volumes:
      - remotion_tmp:/app/tmp
    networks: [autoniix-net]
    depends_on:
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 2G } } }

  remotion-worker-concat:
    profiles: ["vision"]
    build:
      context: ./services/remotion
      dockerfile: Dockerfile
    command: ["npm", "run", "start:worker"]
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
      - WORKER_ROLE=concat
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RENDER_CONCURRENCY=2
      - RENDER_TMP_DIR=/app/tmp
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=${S3_BUCKET:-autoniix}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_KEY:-minioadmin}
      - S3_FORCE_PATH_STYLE=true
      - S3_KEY_PREFIX=prod
    volumes:
      - remotion_tmp:/app/tmp
    networks: [autoniix-net]
    depends_on:
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 1G } } }

  remotion-mcp:
    profiles: ["vision"]
    build:
      context: ./services/remotion
      dockerfile: Dockerfile
    command: ["npm", "run", "mcp"]
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
      - MCP_PORT=4100
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "127.0.0.1:4100:4100"
    networks: [autoniix-net]
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 512M } } }

  # Temporal Workers
  worker-production:
    build: .
    command: python -m src.workers.run_production
    env_file: .env
    networks: [autoniix-net]
    healthcheck:
      disable: true
    depends_on:
      temporal: { condition: service_started }
      postgres-app: { condition: service_healthy }
      redis: { condition: service_healthy }
      research: { condition: service_started }
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 512M } } }

  worker-scheduler:
    build: .
    command: python -m src.workers.run_scheduler
    env_file: .env
    networks: [autoniix-net]
    healthcheck:
      disable: true
    depends_on:
      temporal: { condition: service_started }
      postgres-app: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 256M } } }

  # Go Temporal Workers (workflow orchestration — activities stay in Python)
  go-worker-production:
    build:
      context: ./go
      dockerfile: Dockerfile
      args:
        WORKER: production
    env_file: .env
    environment:
      - TEMPORAL_HOST=temporal:7233
      - TEMPORAL_NAMESPACE=${TEMPORAL_NAMESPACE:-default}
    networks: [autoniix-net]
    healthcheck:
      disable: true
    depends_on:
      temporal: { condition: service_started }
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 64M } } }

  go-worker-scheduler:
    build:
      context: ./go
      dockerfile: Dockerfile
      args:
        WORKER: scheduler
    env_file: .env
    environment:
      - TEMPORAL_HOST=temporal:7233
      - TEMPORAL_NAMESPACE=${TEMPORAL_NAMESPACE:-default}
    networks: [autoniix-net]
    healthcheck:
      disable: true
    depends_on:
      temporal: { condition: service_started }
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 64M } } }

  # ---------------------------------------------------------------------------
  # Go microservices (Phase C, opt-in via `--profile go-services`)
  #
  # These services are ADDITIVE to the Python fleet. Default `docker-compose up`
  # does NOT start them so nothing changes for existing workflows. Enable with:
  #
  #   docker-compose --profile go-services up
  #
  # See docs/architecture/harness-engineering-plan.md v5 for migration status.
  # ---------------------------------------------------------------------------

  # G1: notification-dispatcher — retries stuck notification_deliveries rows.
  # Runs alongside Python's inline dispatcher; uses FOR UPDATE SKIP LOCKED +
  # StaleAfter window so the two never duplicate deliveries.
  notification-dispatcher:
    profiles: ["go-services"]
    build:
      context: ./go
      dockerfile: Dockerfile
      args:
        BINARY_PATH: ./notification-dispatcher/cmd/dispatcher
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_APP_USER:-postgres}:${POSTGRES_APP_PASSWORD:-postgres}@postgres-app:5432/${POSTGRES_APP_DB:-autoniix}
      - NDISP_HTTP_ADDR=:8090
      - NDISP_POLL_INTERVAL_MS=${NDISP_POLL_INTERVAL_MS:-15000}
      - NDISP_STALE_AFTER_MS=${NDISP_STALE_AFTER_MS:-60000}
      - NDISP_BATCH_SIZE=${NDISP_BATCH_SIZE:-50}
      - NDISP_MAX_ATTEMPTS=${NDISP_MAX_ATTEMPTS:-3}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    networks: [autoniix-net]
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    depends_on:
      postgres-app: { condition: service_healthy }
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 64M } } }

  # G2: streaming-hub — gRPC event pub/sub server backed by Redis.
  streaming-hub:
    profiles: ["go-services"]
    build:
      context: ./go
      dockerfile: Dockerfile
      args:
        BINARY_PATH: ./streaming-hub/cmd/hub
    env_file: .env
    environment:
      - GRPC_PORT=9002
      - HTTP_PORT=8092
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=${LOG_LEVEL:-info}
    networks: [autoniix-net]
    ports:
      - "127.0.0.1:9002:9002"
      - "127.0.0.1:8092:8092"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8092/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 64M } } }

  # G3: service-delivery — gRPC delivery service (SEO native, upload via Python proxy).
  service-delivery:
    profiles: ["go-services"]
    build:
      context: ./go
      dockerfile: Dockerfile
      args:
        BINARY_PATH: ./service-delivery/cmd/delivery
    env_file: .env
    environment:
      - GRPC_PORT=9003
      - HTTP_PORT=8097
      - PYTHON_DELIVERY_URL=http://delivery:8007
      - LOG_LEVEL=${LOG_LEVEL:-info}
    networks: [autoniix-net]
    ports:
      - "127.0.0.1:9003:9003"
      - "127.0.0.1:8097:8097"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8097/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    depends_on:
      delivery: { condition: service_healthy }
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 64M } } }

  # G4: service-thumbnail — gRPC stub proxying to Python thumbnail service.
  service-thumbnail:
    profiles: ["go-services"]
    build:
      context: ./go
      dockerfile: Dockerfile
      args:
        BINARY_PATH: ./service-thumbnail/cmd/thumbnail
    env_file: .env
    environment:
      - GRPC_PORT=9004
      - HTTP_PORT=8095
      - PYTHON_THUMBNAIL_URL=http://thumbnail:8005
      - LOG_LEVEL=${LOG_LEVEL:-info}
    networks: [autoniix-net]
    ports:
      - "127.0.0.1:9004:9004"
      - "127.0.0.1:8095:8095"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8095/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    depends_on:
      thumbnail: { condition: service_healthy }
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 64M } } }

  # G5: service-voice — gRPC stub proxying to Python voice service.
  service-voice:
    profiles: ["go-services"]
    build:
      context: ./go
      dockerfile: Dockerfile
      args:
        BINARY_PATH: ./service-voice/cmd/voice
    env_file: .env
    environment:
      - GRPC_PORT=9005
      - HTTP_PORT=8093
      - PYTHON_VOICE_URL=http://voice:8003
      - LOG_LEVEL=${LOG_LEVEL:-info}
    networks: [autoniix-net]
    ports:
      - "127.0.0.1:9005:9005"
      - "127.0.0.1:8093:8093"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8093/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    depends_on:
      voice: { condition: service_healthy }
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 64M } } }

  # G6: service-research — gRPC stub proxying to Python research service.
  service-research:
    profiles: ["go-services"]
    build:
      context: ./go
      dockerfile: Dockerfile
      args:
        BINARY_PATH: ./service-research/cmd/research
    env_file: .env
    environment:
      - GRPC_PORT=9006
      - HTTP_PORT=8094
      - PYTHON_RESEARCH_URL=http://research:8006
      - LOG_LEVEL=${LOG_LEVEL:-info}
    networks: [autoniix-net]
    ports:
      - "127.0.0.1:9006:9006"
      - "127.0.0.1:8094:8094"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8094/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    depends_on:
      research: { condition: service_healthy }
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 64M } } }

  # G7: service-script — gRPC stub proxying to Python script service.
  service-script:
    profiles: ["go-services"]
    build:
      context: ./go
      dockerfile: Dockerfile
      args:
        BINARY_PATH: ./service-script/cmd/script
    env_file: .env
    environment:
      - GRPC_PORT=9007
      - HTTP_PORT=8096
      - PYTHON_SCRIPT_URL=http://script:8002
      - LOG_LEVEL=${LOG_LEVEL:-info}
    networks: [autoniix-net]
    ports:
      - "127.0.0.1:9007:9007"
      - "127.0.0.1:8096:8096"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8096/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    depends_on:
      script: { condition: service_healthy }
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 64M } } }

  # media_jobs worker (AE-355 / Library Sprint) — pulls pending rows from the
  # media_jobs table and runs probe / embed / autotag handlers. ffmpeg-based
  # handlers (transcode_hls, waveform, transcribe, poster-from-video) are
  # registered as skipped until ffmpeg is added to the worker image.
  worker-media-jobs:
    build: .
    command: python -m src.workers.media_jobs.runner
    env_file: .env
    environment:
      MEDIA_JOBS_CONCURRENCY: "${MEDIA_JOBS_CONCURRENCY:-2}"
    networks: [autoniix-net]
    healthcheck:
      disable: true
    depends_on:
      postgres-app: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 384M } } }

  # Sentry Agent — monitors #alerts-critical and #alerts-warnings Slack channels,
  # triages Sentry errors into Jira bugs, and attempts LLM-powered auto-fixes via PR.
  sentry-agent:
    build: { context: ./services/sentry-agent }
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379
    networks: [autoniix-net]
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 256M } } }

  # Dashboard
  dashboard-bff:
    build: .
    command: uvicorn src.services.dashboard.main:app --host 0.0.0.0 --port 8020
    env_file: .env
    ports:
      - "127.0.0.1:8020:8020"
    labels:
      - "traefik.enable=true"
      # API router — api.<domain>. Split-host layout: dash + api on
      # distinct subdomains, both terminating TLS at this Traefik.
      - "traefik.http.routers.bff.rule=Host(`${API_DOMAIN:-api.localhost}`)"
      - "traefik.http.routers.bff.entrypoints=websecure"
      - "traefik.http.routers.bff.tls.certresolver=letsencrypt"
      - "traefik.http.routers.bff.middlewares=secureHeaders@file"
      - "traefik.http.services.bff.loadbalancer.server.port=8020"
    networks: [autoniix-net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8020/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      postgres-app: { condition: service_healthy }
      redis: { condition: service_healthy }
      temporal: { condition: service_started }
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 256M } } }

  dashboard-ui:
    build: ./apps/dashboard
    ports:
      - "127.0.0.1:3000:3000"
    labels:
      - "traefik.enable=true"
      # Dashboard UI — dash.<domain>  (or root <domain> when DASH_DOMAIN unset)
      - "traefik.http.routers.ui.rule=Host(`${DASH_DOMAIN:-${DOMAIN:-localhost}}`)"
      - "traefik.http.routers.ui.entrypoints=websecure"
      - "traefik.http.routers.ui.tls.certresolver=letsencrypt"
      - "traefik.http.routers.ui.middlewares=secureHeaders@file"
      - "traefik.http.services.ui.loadbalancer.server.port=3000"
    environment:
      - NEXT_PUBLIC_API_URL=
      - NEXT_PUBLIC_WS_URL=
      - API_INTERNAL_URL=http://dashboard-bff:8020
      - HOSTNAME=0.0.0.0
    networks: [autoniix-net]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      dashboard-bff: { condition: service_healthy }
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  # Rust API Gateway — /api/v2/* routes (auth, users, channels, workspace)
  # Local dev: http://localhost:8081    Production: https://${GW_DOMAIN}
  # Add GW_DOMAIN=gw.yourdomain.com to .env to enable TLS routing.
  rust-gateway:
    build:
      context: .
      dockerfile: rust/gateway/Dockerfile
    env_file: .env
    environment:
      # Use Docker-network hostname; overrides any localhost URL from .env
      - DATABASE_URL=postgresql://${DB_USER:-app}:${DB_PASSWORD:-changeme}@postgres-app:5432/${DB_NAME:-autoniix}
      - PORT=8080
      - RUST_LOG=${RUST_LOG:-info}
    ports:
      - "127.0.0.1:8081:8080"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gw.rule=Host(`${GW_DOMAIN:-gw.localhost}`)"
      - "traefik.http.routers.gw.entrypoints=websecure"
      - "traefik.http.routers.gw.tls.certresolver=letsencrypt"
      - "traefik.http.routers.gw.middlewares=secureHeaders@file"
      - "traefik.http.services.gw.loadbalancer.server.port=8080"
    networks: [autoniix-net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres-app: { condition: service_healthy }
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 128M } } }

  # Marketing landing page — autoniix.com / www.autoniix.com
  # Caddy (host systemd) reverse-proxies the apex domain to localhost:3002.
  landing-ui:
    build: ./apps/marketing
    ports:
      - "127.0.0.1:3002:3002"
    environment:
      - HOSTNAME=0.0.0.0
      - PORT=3002
    networks: [autoniix-net]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  # Observability stack
  # Prometheus scrapes /metrics from every FastAPI service (wired via
  # src/observability/metrics.py) plus self-scrape. Grafana provisions
  # the Prometheus + Loki datasources and the Pipeline Overview dashboard
  # automatically on first boot.
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`${PROMETHEUS_DOMAIN:-prometheus.localhost}`)"
      - "traefik.http.routers.prometheus.entrypoints=websecure"
      - "traefik.http.routers.prometheus.tls.certresolver=letsencrypt"
      - "traefik.http.routers.prometheus.middlewares=admin-auth@docker,secureHeaders@file"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
    networks: [autoniix-net]
    depends_on:
      - alertmanager
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=:9093
    environment:
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
    ports:
      - "127.0.0.1:9093:9093"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.alertmanager.rule=Host(`${ALERTS_DOMAIN:-alerts.localhost}`)"
      - "traefik.http.routers.alertmanager.entrypoints=websecure"
      - "traefik.http.routers.alertmanager.tls.certresolver=letsencrypt"
      - "traefik.http.routers.alertmanager.middlewares=admin-auth@docker,secureHeaders@file"
      - "traefik.http.services.alertmanager.loadbalancer.server.port=9093"
    networks: [autoniix-net]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

  node-exporter:
    image: prom/node-exporter:v1.8.2
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks: [autoniix-net]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M

  loki:
    image: grafana/loki:2.9.10
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./observability/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks: [autoniix-net]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M

  promtail:
    image: grafana/promtail:2.9.10
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./observability/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [autoniix-net]
    depends_on:
      - loki
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

  # Docker socket proxy — nginx that rewrites /v1.X/* → /v1.43/* before
  # forwarding to docker.sock. Traefik's Docker SDK hardcodes /v1.24/* in
  # request URLs, which Docker 26+ rejects (min API 1.40). This rewrite
  # makes the daemon happy without needing to touch Traefik or Docker.
  socket-proxy:
    image: nginx:1.27-alpine
    profiles: ["disabled-replaced-by-caddy"]
    command: ["nginx", "-g", "daemon off;"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./traefik/socket-proxy.conf:/etc/nginx/nginx.conf:ro
    networks: [autoniix-net]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 32M

  # TLS Gateway (Traefik)
  # Only activated with: docker compose --profile tls up -d
  # Prerequisites: DOMAIN resolves publicly + ports 80/443 open.
  # Local dev: skip this, use http://localhost:3000 + http://localhost:8020
  traefik:
    image: traefik:v3.3
    profiles: ["disabled-replaced-by-caddy"]
    command:
      - "--configFile=/traefik/traefik.yml"
    ports:
      - "80:80"
      - "443:443"
    environment:
      - ACME_EMAIL=${ACME_EMAIL:-admin@yourdomain.com}
      - DOMAIN=${DOMAIN:-localhost}
    depends_on:
      - socket-proxy
    labels:
      # Defines the admin-auth middleware referenced by grafana/prometheus/
      # alertmanager/temporal-ui routers. TRAEFIK_BASIC_AUTH must be set in
      # .env to an htpasswd-encoded `user:hash` string (dollar signs doubled).
      - "traefik.enable=true"
      - "traefik.http.middlewares.admin-auth.basicauth.users=${TRAEFIK_BASIC_AUTH:-admin:$$apr1$$change$$me}"
      - "traefik.http.middlewares.admin-auth.basicauth.realm=Autoniix Admin"
      - "traefik.http.middlewares.admin-auth.basicauth.removeheader=true"
    volumes:
      - ./traefik:/traefik:ro
      - letsencrypt_data:/letsencrypt
    networks: [autoniix-net]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_USERS_DEFAULT_THEME=dark
      - GF_LOG_LEVEL=warn
      - GF_UNIFIED_ALERTING_ENABLED=true
      - GF_ALERTING_ENABLED=false
      - GF_SERVER_ROOT_URL=https://${GRAFANA_DOMAIN:-grafana.localhost}
      - GF_SERVER_DOMAIN=${GRAFANA_DOMAIN:-grafana.localhost}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards-json:ro
    ports:
      - "127.0.0.1:3001:3000"
    labels:
      - "traefik.enable=true"
      # Grafana has its own auth — we skip basic-auth here to avoid double prompts.
      - "traefik.http.routers.grafana.rule=Host(`${GRAFANA_DOMAIN:-grafana.localhost}`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"
      - "traefik.http.routers.grafana.middlewares=secureHeaders@file"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    networks: [autoniix-net]
    depends_on:
      - prometheus
      - loki
      - alertmanager
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
