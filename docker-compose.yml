networks:
  yt-net:
    driver: bridge

volumes:
  pg_app_data:
  pg_temporal_data:
  redis_data:
  minio_data:
  remotion_tmp:
  remotion_bundle_cache:
  prometheus_data:
  grafana_data:
  loki_data:

services:

  # ── Databases ────────────────────────────────────────────
  postgres-app:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: ${DB_NAME:-yt_automation}
      POSTGRES_USER: ${DB_USER:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me_strong_random_64}
    volumes:
      - pg_app_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./scripts/seed-data.sql:/docker-entrypoint-initdb.d/02-seed.sql
    ports:
      - "5433:5432"
    networks: [yt-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-app} -d ${DB_NAME:-yt_automation}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres-temporal:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: temporal
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${TEMPORAL_DB_PASSWORD:-change_me_temporal_64}
    volumes:
      - pg_temporal_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    networks: [yt-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    networks: [yt-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks: [yt-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── MinIO bootstrap (one-shot) ───────────────────────────
  # Creates the bucket on first boot and applies a download policy to the
  # `public/` prefix (used for assets that must be fetched directly by
  # YouTube / browsers without presigning, e.g. thumbnails). Idempotent.
  minio-bootstrap:
    image: minio/mc:latest
    networks: [yt-net]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-yt-automation}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        until mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" >/dev/null 2>&1; do
          echo 'waiting for minio...'; sleep 2
        done
        mc mb -p local/"$$S3_BUCKET" 2>/dev/null || true
        # Public-read on the public/ prefix only (thumbnails for YouTube).
        printf '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetObject"],"Resource":["arn:aws:s3:::%s/public/*"]}]}' "$$S3_BUCKET" > /tmp/public-policy.json
        mc anonymous set-json /tmp/public-policy.json local/"$$S3_BUCKET" 2>/dev/null || true
        echo 'minio bootstrap complete'
    restart: "no"

  # ── Secrets backend (Infisical) ──────────────────────────
  # Optional. Enabled when SECRETS_BACKEND=infisical (default: env).
  # The dashboard-bff and workers read provider credentials from here
  # via src/providers/secrets.py. If this service is down the chain
  # falls back to env, so the stack still boots cleanly.
  infisical:
    image: infisical/infisical:latest-postgres
    profiles: ["secrets"]
    environment:
      ENCRYPTION_KEY: ${INFISICAL_ENCRYPTION_KEY:-6c1fe4e407b8911c104518103505b218}
      AUTH_SECRET: ${INFISICAL_AUTH_SECRET:-5lrMXKKWCVocS/uerPsl7V+TX/aaUaI7iizgsSC0Lw0=}
      DB_CONNECTION_URI: postgres://${DB_USER:-app}:${DB_PASSWORD:-change_me_strong_random_64}@postgres-app:5432/infisical?sslmode=disable
      REDIS_URL: redis://redis:6379/3
      SITE_URL: http://localhost:8222
      TELEMETRY_ENABLED: "false"
    ports:
      - "8222:8080"
    networks: [yt-net]
    depends_on:
      postgres-app:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Temporal ─────────────────────────────────────────────
  temporal:
    image: temporalio/auto-setup:latest
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=${TEMPORAL_DB_PASSWORD:-change_me_temporal_64}
      - POSTGRES_SEEDS=postgres-temporal
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/production.yaml
    volumes:
      - ./config/dynamicconfig:/etc/temporal/config/dynamicconfig
    ports:
      - "7233:7233"
    networks: [yt-net]
    depends_on:
      postgres-temporal:
        condition: service_healthy
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:latest
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:8080
    ports:
      - "8080:8080"
    networks: [yt-net]
    depends_on:
      - temporal
    restart: unless-stopped

  # ── Application Services ─────────────────────────────────
  research:
    build: .
    command: uvicorn src.services.research.main:app --host 0.0.0.0 --port 8001
    env_file: .env
    environment:
      - PORT=8001
      - SENTENCE_TRANSFORMERS_HOME=/app/.cache/sentence_transformers
    ports:
      - "8001:8001"
    networks: [yt-net]
    depends_on:
      postgres-app:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1536M

  script:
    build: .
    command: uvicorn src.services.script.main:app --host 0.0.0.0 --port 8002
    env_file: .env
    environment:
      - PORT=8002
    ports:
      - "8002:8002"
    networks: [yt-net]
    depends_on:
      postgres-app:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1536M

  voice:
    build: .
    command: uvicorn src.services.voice.main:app --host 0.0.0.0 --port 8003
    env_file: .env
    environment:
      - PORT=8003
    ports:
      - "8003:8003"
    networks: [yt-net]
    depends_on:
      postgres-app:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M

  assets:
    build: .
    command: uvicorn src.services.assets.main:app --host 0.0.0.0 --port 8004
    env_file: .env
    environment:
      - PORT=8004
    ports:
      - "8004:8004"
    networks: [yt-net]
    depends_on:
      postgres-app:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  thumbnail:
    build: .
    command: uvicorn src.services.thumbnail.main:app --host 0.0.0.0 --port 8005
    env_file: .env
    environment:
      - PORT=8005
    ports:
      - "8005:8005"
    networks: [yt-net]
    depends_on:
      postgres-app:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M

  assembly:
    build: .
    command: uvicorn src.services.assembly.main:app --host 0.0.0.0 --port 8006
    env_file: .env
    environment:
      - PORT=8006
    ports:
      - "8006:8006"
    networks: [yt-net]
    depends_on:
      postgres-app:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  delivery:
    build: .
    command: uvicorn src.services.delivery.main:app --host 0.0.0.0 --port 8007
    env_file: .env
    environment:
      - PORT=8007
    ports:
      - "8007:8007"
    networks: [yt-net]
    depends_on:
      postgres-app:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  analytics:
    build: .
    command: uvicorn src.services.analytics.main:app --host 0.0.0.0 --port 8008
    env_file: .env
    environment:
      - PORT=8008
    ports:
      - "8008:8008"
    networks: [yt-net]
    depends_on:
      postgres-app:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  admin:
    build: .
    command: uvicorn src.services.admin.main:app --host 0.0.0.0 --port 8009
    env_file: .env
    environment:
      - PORT=8009
    ports:
      - "8009:8009"
    networks: [yt-net]
    depends_on:
      postgres-app:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  direction:
    build: .
    command: uvicorn src.services.direction.main:app --host 0.0.0.0 --port 8010
    env_file: .env
    environment:
      - PORT=8010
    ports:
      - "8010:8010"
    networks: [yt-net]
    depends_on:
      postgres-app:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  brand:
    build: .
    command: uvicorn src.services.brand.main:app --host 0.0.0.0 --port 8012
    env_file: .env
    environment:
      - PORT=8012
    ports:
      - "8012:8012"
    networks: [yt-net]
    depends_on:
      postgres-app:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  editor:
    build: .
    command: uvicorn src.services.editor.main:app --host 0.0.0.0 --port 8013
    env_file: .env
    environment:
      - PORT=8013
    ports:
      - "8013:8013"
    networks: [yt-net]
    depends_on:
      postgres-app:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  sheets-sync:
    build: .
    command: uvicorn src.services.sheets_sync.main:app --host 0.0.0.0 --port 8011
    env_file: .env
    environment:
      - PORT=8011
    ports:
      - "8011:8011"
    networks: [yt-net]
    depends_on:
      postgres-app:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Remotion Renderer ───────────────────────────────────
  remotion-api:
    build:
      context: ./services/remotion
      dockerfile: Dockerfile
    command: ["npm", "run", "start:api"]
    environment:
      - NODE_ENV=production
      - API_PORT=4000
      - LOG_LEVEL=info
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - RENDER_CONCURRENCY=1
      - RENDER_TMP_DIR=/app/tmp
      - S3_ENDPOINT=http://minio:9000
      - S3_REGION=auto
      - S3_BUCKET=${S3_BUCKET:-yt-automation}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_KEY:-minioadmin}
      - S3_PUBLIC_BASE_URL=http://minio:9000/${S3_BUCKET:-yt-automation}
      - S3_FORCE_PATH_STYLE=true
      - S3_KEY_PREFIX=${ENVIRONMENT_MODE:-test}
    ports:
      - "4000:4000"
    networks: [yt-net]
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G

  remotion-worker:
    build:
      context: ./services/remotion
      dockerfile: Dockerfile
    command: ["npm", "run", "start:worker"]
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - RENDER_CONCURRENCY=1
      - RENDER_TMP_DIR=/app/tmp
      - S3_ENDPOINT=http://minio:9000
      - S3_REGION=auto
      - S3_BUCKET=${S3_BUCKET:-yt-automation}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_KEY:-minioadmin}
      - S3_PUBLIC_BASE_URL=http://minio:9000/${S3_BUCKET:-yt-automation}
      - S3_FORCE_PATH_STYLE=true
      - S3_KEY_PREFIX=${ENVIRONMENT_MODE:-test}
    volumes:
      - remotion_tmp:/app/tmp
    networks: [yt-net]
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G

  # ── Remotion Vision: tier-aware workers (P0.11) ──────────
  # Off by default. Enable with `docker compose --profile vision up`.
  remotion-worker-tier1:
    profiles: ["vision"]
    build:
      context: ./services/remotion
      dockerfile: Dockerfile
    command: ["npm", "run", "start:worker"]
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
      - WORKER_ROLE=tier1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RENDER_CONCURRENCY=2
      - RENDER_TMP_DIR=/app/tmp
      - DIFF_CACHE_ENABLED=true
      - BUNDLE_CACHE_DIR=/bundle-cache
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=${S3_BUCKET:-yt-automation}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_KEY:-minioadmin}
      - S3_FORCE_PATH_STYLE=true
      - S3_KEY_PREFIX=${ENVIRONMENT_MODE:-test}
    volumes:
      - remotion_tmp:/app/tmp
      - remotion_bundle_cache:/bundle-cache
    networks: [yt-net]
    depends_on:
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 4G } } }

  remotion-worker-tier2:
    profiles: ["vision"]
    build:
      context: ./services/remotion
      dockerfile: Dockerfile
    command: ["npm", "run", "start:worker"]
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
      - WORKER_ROLE=tier2
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RENDER_CONCURRENCY=4
      - RENDER_TMP_DIR=/app/tmp
      - DIFF_CACHE_ENABLED=true
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=${S3_BUCKET:-yt-automation}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_KEY:-minioadmin}
      - S3_FORCE_PATH_STYLE=true
      - S3_KEY_PREFIX=${ENVIRONMENT_MODE:-test}
    volumes:
      - remotion_tmp:/app/tmp
    networks: [yt-net]
    depends_on:
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 2G } } }

  remotion-worker-concat:
    profiles: ["vision"]
    build:
      context: ./services/remotion
      dockerfile: Dockerfile
    command: ["npm", "run", "start:worker"]
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
      - WORKER_ROLE=concat
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RENDER_CONCURRENCY=2
      - RENDER_TMP_DIR=/app/tmp
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=${S3_BUCKET:-yt-automation}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_KEY:-minioadmin}
      - S3_FORCE_PATH_STYLE=true
      - S3_KEY_PREFIX=${ENVIRONMENT_MODE:-test}
    volumes:
      - remotion_tmp:/app/tmp
    networks: [yt-net]
    depends_on:
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 1G } } }

  remotion-mcp:
    profiles: ["vision"]
    build:
      context: ./services/remotion
      dockerfile: Dockerfile
    command: ["npm", "run", "mcp"]
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
      - MCP_PORT=4100
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "4100:4100"
    networks: [yt-net]
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 512M } } }

  # ── Temporal Workers ─────────────────────────────────────
  worker-production:
    build: .
    command: python -m src.workers.run_production
    env_file: .env
    networks: [yt-net]
    healthcheck:
      disable: true
    depends_on:
      temporal:
        condition: service_started
      postgres-app:
        condition: service_healthy
      redis:
        condition: service_healthy
      research:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  worker-scheduler:
    build: .
    command: python -m src.workers.run_scheduler
    env_file: .env
    networks: [yt-net]
    healthcheck:
      disable: true
    depends_on:
      temporal:
        condition: service_started
      postgres-app:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Dashboard ──────────────────────────────────────────

  dashboard-bff:
    build: .
    command: uvicorn src.services.dashboard.main:app --host 0.0.0.0 --port 8020
    env_file: .env
    ports:
      - "8020:8020"
    networks: [yt-net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8020/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      postgres-app:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  dashboard-ui:
    build: ./dashboard
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=
      - NEXT_PUBLIC_WS_URL=
      - API_INTERNAL_URL=http://dashboard-bff:8020
      # Next.js standalone uses HOSTNAME as bind address — force 0.0.0.0 so
      # the in-container healthcheck (and any sidecar) can reach it.
      - HOSTNAME=0.0.0.0
    networks: [yt-net]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      dashboard-bff:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Observability stack ──────────────────────────────────
  # Prometheus scrapes /metrics from every FastAPI service (wired via
  # src/observability/metrics.py) plus self-scrape. Grafana provisions
  # the Prometheus + Loki datasources and the Pipeline Overview dashboard
  # automatically on first boot.
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    networks: [yt-net]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  loki:
    image: grafana/loki:2.9.10
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./observability/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks: [yt-net]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M

  promtail:
    image: grafana/promtail:2.9.10
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./observability/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [yt-net]
    depends_on:
      - loki
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_USERS_DEFAULT_THEME=dark
      - GF_LOG_LEVEL=warn
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards-json:ro
    ports:
      - "3001:3000"
    networks: [yt-net]
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
