[project]
name = "autoniix-contracts"
version = "0.1.0"
description = "Pydantic models generated from Zod schemas via OpenAPI"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10.6",
    "pydantic-settings>=2.7.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv]
dev-dependencies = [
    "datamodel-code-generator>=0.26.4",
]
