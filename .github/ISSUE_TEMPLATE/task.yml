name: "Task / Subtask"
description: "A technical task, chore, or sub-step of a story"
title: "task | [Layer] | "
labels: ["task", "ready-for-dev"]
assignees: ["saurabhrawat-gh"]
body:
  - type: markdown
    attributes:
      value: |
        **Title format:** `task | DB | Migrate provider catalog to new schema`
        Layers: `UI` `Gateway` `Service` `DB` `Auth` `Worker` `Infra`

  - type: dropdown
    id: layer
    attributes:
      label: "Layer"
      description: "Which layer does this task touch?"
      options:
        - "UI"
        - "Gateway"
        - "Service"
        - "DB"
        - "Auth"
        - "Worker"
        - "Infra"
        - "Multiple"
    validations:
      required: true

  - type: input
    id: parent_story
    attributes:
      label: "Parent Story"
      description: "Issue number of the parent story (e.g. #18)"
      placeholder: "#N"
    validations:
      required: true

  - type: dropdown
    id: parent_epic
    attributes:
      label: "Parent Epic"
      options:
        - "#12 — Authentication & Authorization"
        - "#13 — Workspace & Teams"
        - "#14 — Provider Credentials"
        - "#15 — BA Process & Developer Workflow"
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: "Priority"
      options:
        - "priority:critical"
        - "priority:high"
        - "priority:medium"
        - "priority:low"
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: "What needs to be done"
      placeholder: "Describe the technical task..."
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: "Done When"
      placeholder: |
        - [ ] Migration file created and applied
        - [ ] Tests pass
    validations:
      required: true
