name: Rust Build & Test

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: rust-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-build:
    name: Check & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Check formatting
        working-directory: rust
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: rust
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build all crates (release)
        working-directory: rust
        run: cargo build --release --all-features

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: gateway-binary
          path: rust/target/release/gateway
          retention-days: 7

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: check-and-build
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: autoniix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Apply test DB migrations
        env:
          PGPASSWORD: postgres
        run: |
          for f in $(ls scripts/migrations/*.sql | sort); do
            echo "Applying $f..."
            psql -h localhost -U postgres -d autoniix_test -f "$f" -v ON_ERROR_STOP=0
          done

      - name: Run unit tests
        working-directory: rust
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost/autoniix_test
          AUTH_JWT_SECRET: test-jwt-secret-for-ci
        run: cargo test -p gateway --lib

      - name: Run schema compatibility tests
        working-directory: rust
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost/autoniix_test
          AUTH_JWT_SECRET: test-jwt-secret-for-ci
        run: cargo test -p gateway --test schema_compatibility_test

      - name: Run harness tests (skip if no live services)
        working-directory: rust
        run: cargo test -p harness

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: check-and-build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: rust/gateway/Dockerfile
          push: false
          tags: autoniix/gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
