name: Auto-label new issues as ready-for-dev (Todo)

on:
  workflow_dispatch:
  # issues:
  #   types: [opened]
  # Disabled — issues created via API already have ready-for-dev + milestone set.

jobs:
  label-todo:
    if: ${{ false }}  # disabled — triggers too many runs
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Add ready-for-dev label and assign to milestone
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;

            // Skip if it already has a lifecycle label (e.g. created by an agent)
            const lifecycleLabels = [
              "ready-for-dev","in-progress","dev-done","in-qa",
              "qa-verified","ready-to-deploy","in-prod","prod-verified"
            ];
            const existing = issue.labels.map(l => l.name);
            const hasLifecycle = existing.some(l => lifecycleLabels.includes(l));
            if (hasLifecycle) {
              core.info("Issue already has a lifecycle label — skipping");
              return;
            }

            // Add ready-for-dev label
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: ["ready-for-dev"]
            });

            // Assign to milestone 1 (Autoniix MVP) if not already assigned
            if (!issue.milestone) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                milestone: 1,
                assignees: ["saurabhrawat-gh"]
              });
            }

            core.info(`✅ #${issue.number} labelled ready-for-dev + assigned to milestone`);
