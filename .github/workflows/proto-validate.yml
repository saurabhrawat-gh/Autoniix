name: Proto Validation

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  guard:
    name: Guard — merge from develop only
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify merge source is develop
        run: |
          PARENTS=$(git log -1 --pretty=format:"%P")
          PARENT_COUNT=$(echo "$PARENTS" | wc -w | tr -d ' ')
          MSG=$(git log -1 --pretty=format:"%s")
          if [ "$PARENT_COUNT" -lt 2 ]; then
            echo "❌ Direct push to main is not allowed."
            echo "   Run: git checkout main && git merge --no-ff develop && git push"
            exit 1
          fi
          if ! echo "$MSG" | grep -qi "develop"; then
            echo "❌ Merge source is not 'develop'. Message: $MSG"
            exit 1
          fi
          echo "✅ Merge from develop confirmed."

  lint:
    needs: guard
    if: always() && (needs.guard.result == 'success' || github.event_name == 'workflow_dispatch')
    name: Buf Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: bufbuild/buf-setup-action@v1.47.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint proto files
        working-directory: proto
        run: buf lint

      - name: Format check
        working-directory: proto
        run: |
          buf format -d --exit-code

  breaking:
    needs: guard
    if: always() && (needs.guard.result == 'success' || github.event_name == 'workflow_dispatch')
    name: Breaking Change Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: bufbuild/buf-setup-action@v1.47.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for breaking changes
        working-directory: proto
        run: |
          buf breaking --against "https://github.com/${{ github.repository }}.git#branch=develop"

  generate:
    needs: guard
    if: always() && (needs.guard.result == 'success' || github.event_name == 'workflow_dispatch')
    name: Test Code Generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: bufbuild/buf-setup-action@v1.47.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate code
        working-directory: proto
        run: buf generate

      - name: Verify generated files
        run: |
          if [ -z "$(ls -A gen/go)" ]; then
            echo "Error: No Go files generated"
            exit 1
          fi
          if [ -z "$(ls -A gen/rust)" ]; then
            echo "Error: No Rust files generated"
            exit 1
          fi
          if [ -z "$(ls -A gen/python)" ]; then
            echo "Error: No Python files generated"
            exit 1
          fi
          if [ -z "$(ls -A dashboard/src/generated)" ]; then
            echo "Error: No TypeScript files generated"
            exit 1
          fi
          echo "✅ All code generation successful"
