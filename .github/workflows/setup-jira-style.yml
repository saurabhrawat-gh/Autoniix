name: Setup Jira-style Labels & ATNX Prefixes

on:
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  setup:
    if: ${{ false }}  # disabled — run manually only when needed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests --quiet

      - name: Run setup script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/setup_jira_style.py
