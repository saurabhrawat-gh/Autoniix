name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-lint-and-tests:
    name: Python — lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          # CI install: keep the heaviest ML deps out of the lint/test matrix
          # (sentence-transformers, opencv, librosa) — they are exercised in
          # the docker smoke job below.
          grep -vE '^(sentence-transformers|opencv-python-headless|librosa|spacy|nltk|textstat|soundfile|pydub|google-generativeai|anthropic|elevenlabs|edge-tts|gspread|google-auth|google-api-python-client|wikipedia|pytrends)' requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt
          pip install ruff mypy

      - name: Lint
        run: ruff check src tests scripts || true   # warn-only until we baseline

      - name: AST parse all services + workers
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          fails = []
          for p in pathlib.Path('src').rglob('*.py'):
              try:
                  ast.parse(p.read_text())
              except SyntaxError as e:
                  fails.append(f"{p}: {e}")
          if fails:
              print("\n".join(fails)); sys.exit(1)
          print("all .py files parse cleanly")
          PY

      - name: Unit tests (skip e2e + integration)
        env:
          ENVIRONMENT_MODE: test
        run: pytest tests -q --ignore=tests/e2e -m "not integration"

      - name: Prompt-eval (golden cases on mock_llm)
        env:
          ENVIRONMENT_MODE: test
        run: python scripts/run_prompt_eval.py

  remotion-typecheck:
    name: Remotion — typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/remotion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/remotion/package-lock.json
      - run: npm ci || npm install
      - run: npx tsc --noEmit

  dashboard-typecheck:
    name: Dashboard — typecheck + UI token lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci || npm install
      - run: npm run lint:tokens:strict
      - run: npx tsc --noEmit

  dependency-scan:
    name: Security — pip-audit + SBOM
    runs-on: ubuntu-latest
    needs: [python-lint-and-tests]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install audit + SBOM tools
        run: pip install pip-audit cyclonedx-bom

      - name: Vulnerability scan (pip-audit)
        run: |
          pip install -r requirements.txt --quiet 2>/dev/null || true
          pip-audit --requirement requirements.txt \
                    --skip-editable \
                    --output json \
                    --output-file pip-audit-report.json \
                    --ignore-vuln GHSA-r9hx-vwmv-q579 || true
          pip-audit --requirement requirements.txt \
                    --skip-editable \
                    --format columns \
                    || echo "⚠  Vulnerabilities found — see pip-audit-report.json artifact"

      - name: Generate SBOM (CycloneDX JSON)
        run: |
          pip install -r requirements.txt --quiet 2>/dev/null || true
          cyclonedx-py environment \
            --output-format json \
            --outfile sbom.json \
            || true

      - name: Upload audit + SBOM artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports-${{ github.sha }}
          path: |
            pip-audit-report.json
            sbom.json
          retention-days: 90

  e2e-render-smoke:
    name: E2E — render smoke (Remotion + MinIO)
    runs-on: ubuntu-latest
    needs: [python-lint-and-tests, remotion-typecheck]
    # Only run on PRs to main and on main itself — too heavy for every push.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Boot the render plane (MinIO + bootstrap + Remotion)
        env:
          ENVIRONMENT_MODE: test
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
          S3_BUCKET: autoniix
          S3_PUBLIC_BASE_URL: http://localhost:9000/autoniix
        run: |
          # Wait only on services that expose a healthcheck. The
          # remotion-worker is a BullMQ consumer with no HTTP endpoint
          # and its healthcheck is intentionally disabled, so docker
          # compose >=2.20 would fail --wait if it's included here.
          docker compose up -d --wait minio minio-bootstrap remotion-api
          docker compose up -d remotion-worker
          docker compose logs --tail=50 minio-bootstrap

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install smoke deps
        run: pip install httpx pytest

      - name: Install ffmpeg for QC checks
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run smoke test
        env:
          YT_E2E_REMOTION_URL: http://localhost:4000
        run: pytest tests/e2e/test_render_smoke.py -v

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs --tail=200 remotion-api remotion-worker minio || true

  deploy:
    name: Deploy — VPS (main push only)
    runs-on: ubuntu-latest
    needs: [python-lint-and-tests, remotion-typecheck, dependency-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip deploy]')
    steps:
      # Pre-flight check. The appleboy/ssh-action's failure modes
      # ("ssh: no key found", "dial tcp ***:***: i/o timeout") are
      # opaque — they don't tell you which secret is wrong. This step
      # asserts each VPS_* secret is present and that VPS_SSH_KEY at
      # least has a valid PEM envelope, then fails fast with a clear
      # message if anything is off. Lengths are printed but contents
      # never are; PEM headers/footers are constants, not secrets.
      - name: Verify deploy secrets are configured
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          fail=0
          check_required () {
            local name=$1 val=$2
            if [ -z "$val" ]; then
              echo "::error::$name secret is empty or unset"
              fail=1
            else
              echo "ok   $name is set (${#val} chars)"
            fi
          }
          check_optional () {
            local name=$1 val=$2 default=$3
            if [ -z "$val" ]; then
              echo "info $name not set — workflow will use default '$default'"
            else
              echo "ok   $name is set (${#val} chars)"
            fi
          }

          echo "── Required secrets ────────────────────────────────"
          check_required VPS_HOST    "$VPS_HOST"
          check_required VPS_USER    "$VPS_USER"
          check_required VPS_SSH_KEY "$VPS_SSH_KEY"
          echo "── Optional secrets ────────────────────────────────"
          check_optional VPS_SSH_PORT "$VPS_SSH_PORT" "2222"

          echo "── VPS_SSH_KEY format checks ───────────────────────"
          if [ -n "$VPS_SSH_KEY" ]; then
            first_line=$(printf '%s\n' "$VPS_SSH_KEY" | head -1)
            last_line=$(printf '%s\n' "$VPS_SSH_KEY" | grep -E '^-----END' | tail -1)

            if printf '%s' "$first_line" | grep -qE '^-----BEGIN (OPENSSH|RSA|EC|DSA|ENCRYPTED) PRIVATE KEY-----'; then
              echo "ok   first line is a valid PEM BEGIN header"
            else
              echo "::error::VPS_SSH_KEY first line is NOT a PEM BEGIN header — you probably pasted the .pub file or stripped the header lines."
              echo "         expected something like: -----BEGIN OPENSSH PRIVATE KEY-----"
              fail=1
            fi

            if [ -n "$last_line" ]; then
              echo "ok   PEM END footer found"
            else
              echo "::error::VPS_SSH_KEY has NO '-----END ... PRIVATE KEY-----' footer — newlines were probably stripped on paste."
              fail=1
            fi

            if printf '%s' "$first_line" | grep -q 'ENCRYPTED'; then
              echo "::error::VPS_SSH_KEY is passphrase-protected. Either re-export it without a passphrase, or add a VPS_SSH_PASSPHRASE secret + wire it into the workflow."
              fail=1
            fi

            if printf '%s' "$VPS_SSH_KEY" | head -1 | grep -qE '^(ssh-rsa|ssh-ed25519|ecdsa-sha2)'; then
              echo "::error::VPS_SSH_KEY looks like a PUBLIC key (id_*.pub). You need the matching PRIVATE key (no .pub extension)."
              fail=1
            fi
          fi

          if [ "$fail" -ne 0 ]; then
            echo
            echo "Deploy aborted. Fix the items marked ::error:: above, then re-run."
            echo "Quickstart: see the 'Deploying to a VPS' section of the repo wiki, or"
            echo "  gh secret set VPS_SSH_KEY --repo \$GITHUB_REPOSITORY < ~/.ssh/id_ed25519"
            exit 1
          fi
          echo "all deploy secrets look valid"

      - name: Deploy to VPS via SSH
        id: deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || '2222' }}
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd ~/autoniix
            git fetch --all --prune
            git reset --hard origin/main
            export RELEASE_SHA="${GITHUB_SHA:-$(git rev-parse HEAD)}"
            docker compose --profile tls up -d --build --remove-orphans
            docker compose ps --format "table {{.Name}}\t{{.Status}}"
            echo "Deploy complete at $(date -u)"

      - name: Post-deploy smoke
        id: smoke
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || '2222' }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd ~/autoniix
            # Wait up to 90s for bff to become healthy after restart.
            for i in $(seq 1 30); do
              if curl -fsS http://localhost:8020/health >/dev/null 2>&1; then
                echo "bff healthy after ${i} attempts"
                break
              fi
              sleep 3
            done
            make smoke

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          [ -z "${SLACK_WEBHOOK_URL}" ] && { echo "no webhook"; exit 0; }
          curl -fsS -X POST -H 'Content-Type: application/json' \
            --data "{\"text\":\":rotating_light: *Deploy FAILED* on \`${GITHUB_REF_NAME}\` (\`${GITHUB_SHA:0:7}\`)\nCommit: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}\nRun: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
            "${SLACK_WEBHOOK_URL}"

      - name: Notify Slack on success
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          [ -z "${SLACK_WEBHOOK_URL}" ] && { echo "no webhook"; exit 0; }
          curl -fsS -X POST -H 'Content-Type: application/json' \
            --data "{\"text\":\":white_check_mark: Deploy OK — \`${GITHUB_SHA:0:7}\` (${GITHUB_ACTOR})\"}" \
            "${SLACK_WEBHOOK_URL}"
