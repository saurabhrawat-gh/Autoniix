name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feat/**'
      - 'fix/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual trigger"
        required: false
        default: "manual"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Phase 7 stack: Python + TypeScript only. Rust/Go removed.
# Job list here MUST match scripts/ci-local.sh functions 1:1 (Phase B).
# The `harness-summary` job at the bottom is the single required status check
# gating branch protection on develop and main.
#
# Branch policy (Phase G):
#   feature/* --> PR --> develop --> promote-develop-to-main.yml --> main --> deploy
#   direct pushes to main are rejected by the `guard` job.

jobs:
  # ─── Gate 1: push provenance ──────────────────────────────────────────────
  guard:
    name: Guard — main only from develop
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Skip for feature branches and PRs
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify HEAD's second parent is on develop
        run: |
          set -euo pipefail
          PARENTS=$(git log -1 --pretty=format:"%P")
          PARENT_COUNT=$(echo "$PARENTS" | wc -w | tr -d ' ')
          MSG=$(git log -1 --pretty=format:"%s")
          if [ "$PARENT_COUNT" -lt 2 ]; then
            # Allow first commit / non-merge only when it's a hotfix landing
            # directly on main via signed commit (rare).
            if echo "$MSG" | grep -qE '^hotfix\('; then
              echo "✅ hotfix commit on main — allowed."
              exit 0
            fi
            echo "❌ Direct push to main is not allowed."
            echo "   Merge develop → main via PR (or use hotfix/* branch)."
            exit 1
          fi
          # Second parent must be an ancestor of origin/develop (or origin/hotfix/*).
          PARENT2=$(echo "$PARENTS" | awk '{print $2}')
          git fetch origin develop --quiet
          if git merge-base --is-ancestor "$PARENT2" origin/develop 2>/dev/null; then
            echo "✅ Merge parent ($PARENT2) is on origin/develop."
            exit 0
          fi
          # Try hotfix/* branches
          for br in $(git branch -r --list 'origin/hotfix/*' 2>/dev/null); do
            if git merge-base --is-ancestor "$PARENT2" "$br" 2>/dev/null; then
              echo "✅ Merge parent is on $br (hotfix)."
              exit 0
            fi
          done
          echo "❌ Merge parent $PARENT2 is not on develop or any hotfix/* branch."
          echo "   Message: $MSG"
          exit 1

  # ─── Job: python-lint-and-tests (mirrors ci-local.sh job_python) ─────────
  python-lint-and-tests:
    name: Python — lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          # Keep heavy ML deps out of the lint/test matrix (exercised in e2e-render-smoke).
          grep -vE '^(sentence-transformers|opencv-python-headless|librosa|spacy|nltk|textstat|soundfile|pydub|google-generativeai|anthropic|elevenlabs|edge-tts|gspread|google-auth|google-api-python-client|wikipedia|pytrends)' requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt
          pip install grpcio grpcio-tools psycopg2-binary
          pip install -r requirements-dev.txt

      - name: Format check
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: AST parse
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          fails = []
          for base in ("shared/python", "backend", "scripts"):
              root = pathlib.Path(base)
              if not root.exists():
                  continue
              for p in root.rglob("*.py"):
                  try:
                      ast.parse(p.read_text())
                  except SyntaxError as e:
                      fails.append(f"{p}: {e}")
          if fails:
              print("\n".join(fails)); sys.exit(1)
          print("AST parse clean")
          PY

      - name: Unit tests (skip e2e + integration)
        run: pytest tests -q --ignore=tests/e2e -m "not integration"

      - name: Prompt-eval (golden cases on mock_llm)
        run: python scripts/run_prompt_eval.py

  # ─── Job: node (mirrors ci-local.sh job_node) ─────────────────────────────
  ts-typecheck-and-tests:
    name: TypeScript — contracts + gateway + streaming-hub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install root workspace
        run: npm ci

      - name: Contracts typecheck
        working-directory: shared/ts/contracts
        run: npm run typecheck

      - name: Gateway typecheck + test
        working-directory: backend/api/gateway
        run: |
          npm run typecheck
          npm test

      - name: Streaming-hub typecheck + test
        working-directory: backend/api/streaming-hub
        run: |
          npm run typecheck
          npm test

  # ─── Job: dashboard (mirrors ci-local.sh job_dashboard) ───────────────────
  dashboard-typecheck:
    name: Dashboard — typecheck + tests + UI-token lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/dashboard/package-lock.json
      - run: npm ci || npm install
      - run: npm run lint:tokens:strict
      - run: npx tsc --noEmit
      - run: npm test -- --watch=false --passWithNoTests

  # ─── Job: remotion (mirrors ci-local.sh job_remotion) ─────────────────────
  remotion-typecheck:
    name: Remotion — typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/media/remotion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/media/remotion/package-lock.json
      - run: npm ci || npm install
      - run: npx tsc --noEmit

  # ─── Job: dependency-scan (mirrors ci-local.sh job_deps) ──────────────────
  dependency-scan:
    name: Security — pip-audit + SBOM
    runs-on: ubuntu-latest
    needs: [python-lint-and-tests]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install audit + SBOM tools
        run: pip install pip-audit cyclonedx-bom

      - name: Vulnerability scan (pip-audit)
        run: |
          pip install -r requirements.txt --quiet 2>/dev/null || true
          pip-audit --requirement requirements.txt \
                    --skip-editable \
                    --output json \
                    --output-file pip-audit-report.json \
                    --ignore-vuln GHSA-r9hx-vwmv-q579 || true
          pip-audit --requirement requirements.txt \
                    --skip-editable \
                    --format columns \
                    --ignore-vuln GHSA-r9hx-vwmv-q579

      - name: Generate SBOM (CycloneDX JSON)
        run: |
          pip install -r requirements.txt --quiet 2>/dev/null || true
          cyclonedx-py environment --output-format json --outfile sbom.json || true

      - name: Upload audit + SBOM artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports-${{ github.sha }}
          path: |
            pip-audit-report.json
            sbom.json
          retention-days: 90

  # ─── Job: migration-equivalence (mirrors ci-local.sh job_migration) ──────
  migration-equivalence:
    name: Migration — equivalence + schema tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: autoniix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install deps
        run: pip install httpx pytest psycopg2-binary pyjwt structlog asyncpg pydantic-settings

      - name: Apply test DB schema (init + migrations)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d autoniix_test -f scripts/init-db.sql -v ON_ERROR_STOP=1
          for f in infra/migrations/*.sql; do
            psql -h localhost -U postgres -d autoniix_test -f "$f" -v ON_ERROR_STOP=1
          done

      - name: Run schema compatibility tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost/autoniix_test
        run: pytest tests/migration/test_schema_compatibility.py -v

      - name: Run golden file tests
        run: pytest tests/golden/test_auth_golden.py -v

      - name: Run security tests
        run: pytest tests/security/test_auth_security.py -v

  # ─── Job: harness-summary — SINGLE REQUIRED STATUS CHECK for branch protection
  harness-summary:
    name: harness/all-green
    runs-on: ubuntu-latest
    if: always()
    needs:
      - python-lint-and-tests
      - ts-typecheck-and-tests
      - dashboard-typecheck
      - remotion-typecheck
      - dependency-scan
      - migration-equivalence
    # Note: guard is not in needs list to allow feature branches to run
    steps:
      - name: Aggregate results
        run: |
          echo "python-lint-and-tests: ${{ needs.python-lint-and-tests.result }}"
          echo "ts-typecheck-and-tests: ${{ needs.ts-typecheck-and-tests.result }}"
          echo "dashboard-typecheck: ${{ needs.dashboard-typecheck.result }}"
          echo "remotion-typecheck: ${{ needs.remotion-typecheck.result }}"
          echo "dependency-scan: ${{ needs.dependency-scan.result }}"
          echo "migration-equivalence: ${{ needs.migration-equivalence.result }}"
          FAILED=0
          for r in \
            "${{ needs.python-lint-and-tests.result }}" \
            "${{ needs.ts-typecheck-and-tests.result }}" \
            "${{ needs.dashboard-typecheck.result }}" \
            "${{ needs.remotion-typecheck.result }}" \
            "${{ needs.dependency-scan.result }}" \
            "${{ needs.migration-equivalence.result }}"; do
            if [[ "$r" != "success" ]]; then FAILED=1; fi
          done
          if [[ "$FAILED" == "1" ]]; then
            echo "❌ harness NOT green — at least one job failed or was skipped."
            exit 1
          fi
          echo "✅ harness/all-green"

  # ─── Deploy — main only, gated on guard + harness-summary ────────────────
  deploy:
    name: Deploy — VPS
    runs-on: self-hosted
    needs: [guard, harness-summary]
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.guard.result == 'success'
      && needs.harness-summary.result == 'success'
      && !contains(github.event.head_commit.message, '[skip deploy]')
    steps:
      - name: Deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory /home/autoniix/autoniix
          cd /home/autoniix/autoniix
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/saurabhrawat-gh/Autoniix.git"
          git fetch --all --prune
          git reset --hard origin/main
          export RELEASE_SHA="${GITHUB_SHA:-$(git rev-parse HEAD)}"
          docker compose --profile tls down --remove-orphans 2>/dev/null || true
          docker compose --profile tls up -d --build --remove-orphans

          # Sync postgres password from .env → running postgres (data volume persists across deploys).
          DB_USER_VAL=$(grep -m1 '^DB_USER=' .env 2>/dev/null | sed 's/^DB_USER=//' | tr -d "\"'" || true)
          DB_USER_VAL="${DB_USER_VAL:-app}"
          DB_PASS_VAL=$(grep -m1 '^DB_PASSWORD=' .env 2>/dev/null | sed 's/^DB_PASSWORD=//' | tr -d "\"'" || true)
          DB_PASS_VAL="${DB_PASS_VAL:-change_me_strong_random_64}"
          printf "ALTER USER \"%s\" WITH ENCRYPTED PASSWORD '%s';\n" \
            "${DB_USER_VAL}" "${DB_PASS_VAL}" | \
            docker compose exec -T postgres-app psql -U "${DB_USER_VAL}" -d postgres \
            && echo "✅ postgres password synced" \
            || echo "⚠️  postgres password sync failed (non-fatal)"

          docker compose ps --format "table {{.Name}}\t{{.Status}}"
          echo "Deploy complete at $(date -u)"

      - name: Sync Caddyfile + reload Caddy
        continue-on-error: true
        run: |
          cd /home/autoniix/autoniix
          if sudo -n true 2>/dev/null; then
            if ! sudo -n diff -q Caddyfile /etc/caddy/Caddyfile >/dev/null 2>&1; then
              echo "Caddyfile changed — syncing and reloading"
              sudo -n cp Caddyfile /etc/caddy/Caddyfile
              sudo -n caddy validate --config /etc/caddy/Caddyfile && \
              sudo -n systemctl reload caddy && \
              echo "✅ Caddy reloaded"
            else
              echo "Caddyfile unchanged — skipping reload"
            fi
          else
            echo "⚠️  NOPASSWD sudo not configured for runner — skipping Caddy reload."
          fi

      - name: Post-deploy — apply pending DB migrations + register Temporal schedules
        run: |
          set -euo pipefail
          cd /home/autoniix/autoniix

          DB_HEALTHY=false
          for i in $(seq 1 30); do
            HEALTH=$(curl -fsS http://localhost:8020/health 2>/dev/null || echo '{}')
            if echo "$HEALTH" | python3 -c \
                "import sys,json; d=json.load(sys.stdin); sys.exit(0 if d.get('components',{}).get('db') else 1)" \
                2>/dev/null; then
              echo "bff+db healthy after ${i} attempts — proceeding"
              DB_HEALTHY=true
              break
            fi
            echo "attempt ${i}/30: db not healthy yet — waiting 3s"
            sleep 3
          done
          if [ "$DB_HEALTHY" = "false" ]; then
            echo "=== BFF container logs (last 100 lines) ==="
            docker compose logs --tail=100 dashboard-bff 2>/dev/null || true
            echo "ERROR: BFF DB component not healthy after 90s — aborting migration"
            exit 1
          fi

          echo "── Applying pending DB migrations (idempotent) ──"
          docker compose exec -T dashboard-bff python -m scripts.run_migrations

          echo "── Registering Temporal schedules (idempotent) ──"
          docker compose exec -T worker-scheduler \
            python -m scripts.register_schedules --temporal-host temporal:7233

      - name: Post-deploy smoke
        run: |
          set -e
          curl -fsS http://localhost:8020/health | python3 -m json.tool
          echo "Deploy verified."
