name: Epic rollup — propagate child story state to parent Epic

# Fires on every story label/close. If a story's body declares
# "**Parent Epic:** #N", we re-evaluate that Epic:
#   - If ALL children are closed             → close the Epic
#   - If ALL children have qa-verified label → add qa-verified to Epic
#   - If ALL children have prod-verified label → add prod-verified to Epic + close
#
# Children of an Epic are discovered by scanning the Epic body for
# task-list lines of the form "- [ ] #123" or "- [x] #123".

on:
  workflow_dispatch:
    inputs:
      epic_number:
        description: "Re-evaluate a specific Epic number (manual run)"
        required: false
        type: string
  issues:
    types: [closed, reopened, labeled, unlabeled]

jobs:
  rollup:
    # Trigger only on the labels we propagate, or on close/reopen.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.action == 'closed' ||
      github.event.action == 'reopened' ||
      (
        (github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
        contains(fromJSON('["qa-verified","prod-verified"]'), github.event.label.name)
      )
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Roll up child state to parent Epic
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;

            // ─── Resolve which Epic to re-evaluate ────────────────────────
            let epicNumber = null;

            if (context.eventName === 'workflow_dispatch') {
              epicNumber = parseInt(context.payload.inputs?.epic_number || '0', 10) || null;
            } else {
              // Story event — find its parent Epic from the body.
              const story = context.payload.issue;
              if (!story?.body) {
                core.info(`#${story?.number}: no body, skipping`);
                return;
              }
              const m = story.body.match(/\*\*Parent Epic:\*\*\s*#(\d+)/i);
              if (!m) {
                core.info(`#${story.number}: no "Parent Epic: #N" reference, skipping`);
                return;
              }
              epicNumber = parseInt(m[1], 10);
            }

            if (!epicNumber) {
              core.info('No epic number resolved, skipping');
              return;
            }

            core.info(`Re-evaluating Epic #${epicNumber}`);

            // ─── Fetch the Epic ───────────────────────────────────────────
            let epic;
            try {
              epic = (await github.rest.issues.get({
                owner, repo, issue_number: epicNumber
              })).data;
            } catch (e) {
              core.warning(`Could not fetch Epic #${epicNumber}: ${e.message}`);
              return;
            }

            // Guard: must actually be labelled as epic (defensive — prevents
            // accidental cascades if a story claims another story as parent).
            const epicLabels = epic.labels.map(l => l.name);
            if (!epicLabels.includes('epic') && !epicLabels.includes('type:epic')) {
              core.info(`#${epicNumber} is not an Epic, skipping`);
              return;
            }

            // ─── Parse child issue numbers from the Epic body ─────────────
            // Match lines like:  - [ ] #16   or   - [x] #17 — title text
            const body = epic.body || '';
            const childNumbers = [...body.matchAll(/^\s*-\s*\[[ xX]\]\s*#(\d+)/gm)]
              .map(m => parseInt(m[1], 10));

            if (childNumbers.length === 0) {
              core.info(`Epic #${epicNumber} body has no "- [ ] #N" child references, skipping`);
              return;
            }

            core.info(`Epic #${epicNumber} children: ${childNumbers.join(', ')}`);

            // ─── Fetch each child ─────────────────────────────────────────
            const children = [];
            for (const n of childNumbers) {
              try {
                const c = (await github.rest.issues.get({
                  owner, repo, issue_number: n
                })).data;
                children.push(c);
              } catch (e) {
                core.warning(`Could not fetch child #${n}: ${e.message} — treating as not-done`);
                return; // bail out — incomplete picture
              }
            }

            // ─── Aggregate state ──────────────────────────────────────────
            const allClosed         = children.every(c => c.state === 'closed');
            const allQaVerified     = children.every(c => c.labels.some(l => l.name === 'qa-verified') || c.labels.some(l => l.name === 'prod-verified'));
            const allProdVerified   = children.every(c => c.labels.some(l => l.name === 'prod-verified'));

            core.info(`Aggregate: allClosed=${allClosed} allQaVerified=${allQaVerified} allProdVerified=${allProdVerified}`);

            const epicHasLabel = (name) => epicLabels.includes(name);
            let actions = [];

            // ─── Propagate qa-verified ────────────────────────────────────
            if (allQaVerified && !epicHasLabel('qa-verified') && !epicHasLabel('prod-verified')) {
              await github.rest.issues.addLabels({
                owner, repo, issue_number: epicNumber,
                labels: ['qa-verified']
              });
              actions.push('added qa-verified');
            }

            // ─── Propagate prod-verified ──────────────────────────────────
            if (allProdVerified && !epicHasLabel('prod-verified')) {
              await github.rest.issues.addLabels({
                owner, repo, issue_number: epicNumber,
                labels: ['prod-verified']
              });
              actions.push('added prod-verified');
            }

            // ─── Close Epic when all children closed ──────────────────────
            if (allClosed && epic.state === 'open') {
              await github.rest.issues.update({
                owner, repo, issue_number: epicNumber,
                state: 'closed',
                state_reason: 'completed'
              });
              actions.push('closed');
            }

            // ─── Reopen Epic if a child got reopened ──────────────────────
            if (!allClosed && epic.state === 'closed' && context.payload.action === 'reopened') {
              await github.rest.issues.update({
                owner, repo, issue_number: epicNumber,
                state: 'open'
              });
              actions.push('reopened');
            }

            if (actions.length === 0) {
              core.info(`No changes needed for Epic #${epicNumber}`);
            } else {
              core.info(`✅ Epic #${epicNumber}: ${actions.join(', ')}`);
            }
