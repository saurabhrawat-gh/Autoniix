openapi: 3.0.3
info:
  title: Autoniix Rust Gateway API
  description: |
    REST API for the Autoniix Rust Gateway.
    Handles authentication, user management, and workspace operations.
    
    **Status:** Handwritten schema (Week 1 Day 1). Will be replaced with auto-generated
    schema from utoipa annotations in Phase 1.
  version: 0.1.0
  contact:
    name: Autoniix Team

servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://api.autoniix.com
    description: Production

tags:
  - name: auth
    description: Authentication endpoints
  - name: user
    description: User management endpoints

paths:
  /api/v2/auth/signup:
    post:
      tags: [auth]
      summary: Create new user account
      description: Register a new user and create their first workspace
      operationId: signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, workspace_name]
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
                  minLength: 8
                  example: securepassword123
                display_name:
                  type: string
                  nullable: true
                  example: John Doe
                workspace_name:
                  type: string
                  minLength: 2
                  maxLength: 60
                  example: My Workspace
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignUpResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v2/auth/signin:
    post:
      tags: [auth]
      summary: Sign in to existing account
      operationId: signin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                workspace_id:
                  type: integer
                  format: int64
                  nullable: true
      responses:
        '200':
          description: Sign in successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v2/auth/refresh:
    post:
      tags: [auth]
      summary: Refresh access token
      description: Rotate refresh token and get new access token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
                  description: Opaque refresh token from sign-in/sign-up
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v2/auth/verify:
    post:
      tags: [auth]
      summary: Verify JWT access token
      operationId: verifyToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: JWT access token
      responses:
        '200':
          description: Token verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyTokenResponse'

  /api/v2/auth/logout:
    post:
      tags: [auth]
      summary: Logout and revoke refresh token
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/v2/me:
    get:
      tags: [user]
      summary: Get current user info
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SignUpResponse:
      type: object
      required: [access_token, refresh_token, expires_in, user, workspace]
      properties:
        access_token:
          type: string
          description: JWT access token (1 hour expiry)
        refresh_token:
          type: string
          description: Opaque refresh token (30 day expiry)
        expires_in:
          type: integer
          example: 3600
          description: Access token expiry in seconds
        user:
          $ref: '#/components/schemas/UserResponse'
        workspace:
          $ref: '#/components/schemas/WorkspaceResponse'

    SignInResponse:
      type: object
      required: [access_token, refresh_token, expires_in, user]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
          example: 3600
        user:
          $ref: '#/components/schemas/UserResponse'

    RefreshTokenResponse:
      type: object
      required: [access_token, refresh_token, expires_in]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
          description: New refresh token (old one is rotated)
        expires_in:
          type: integer
          example: 3600

    VerifyTokenResponse:
      type: object
      required: [valid]
      properties:
        valid:
          type: boolean
        user_id:
          type: string
          nullable: true
          description: Stringified i64 user ID
        wid:
          type: integer
          format: int64
          nullable: true
          description: Workspace ID
        email:
          type: string
          nullable: true
        role:
          type: string
          nullable: true
          description: Workspace-scoped role
        global_role:
          type: string
          nullable: true
          description: Platform-level role

    UserResponse:
      type: object
      required: [id, email, role]
      properties:
        id:
          type: integer
          format: int64
          example: 123
        email:
          type: string
          format: email
        display_name:
          type: string
          nullable: true
        active_workspace_id:
          type: integer
          format: int64
          nullable: true
        role:
          type: string
          description: Global role (superadmin|user)
          example: user

    WorkspaceResponse:
      type: object
      required: [id, name, slug, owner_user_id]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        slug:
          type: string
          description: URL-friendly identifier
        owner_user_id:
          type: integer
          format: int64

    CurrentUserResponse:
      type: object
      required: [user, workspace]
      properties:
        user:
          $ref: '#/components/schemas/UserInfo'
        workspace:
          $ref: '#/components/schemas/WorkspaceInfo'

    UserInfo:
      type: object
      required: [id, email, role, global_role]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        display_name:
          type: string
          nullable: true
        role:
          type: string
          description: Workspace-scoped role
        global_role:
          type: string
          description: Platform-level role

    WorkspaceInfo:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string

    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        code:
          type: string
