<html lang="en">
<head>

  <title>Autoniix &#8212; Theme Variants</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    * { margin:0;padding:0;box-sizing:border-box; }
    body { font-family:'Inter',system-ui,sans-serif; background:#060606; color:#fff; padding:56px 32px 80px; }
    .page-hdr { margin-bottom:48px; }
    .page-title { font-size:24px;font-weight:700;letter-spacing:-0.04em;color:#fff;margin-bottom:6px; }
    .page-sub { font-size:12px;color:#444;letter-spacing:0.01em; }
    .page-sub em { color:#888;font-style:normal; }
    .group-row { display:flex;align-items:center;gap:12px;margin:52px 0 18px; }
    .group-line { flex:1;height:1px;background:linear-gradient(90deg,#222 0%,transparent 100%); }
    .group-tag { font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.14em;color:#333;white-space:nowrap; }
    .group-note { font-size:10px;color:#2A2A2A;white-space:nowrap; }
    .grid { display:flex;flex-direction:column;gap:20px; }

    /* card chrome */
    .card { border-radius:16px;overflow:hidden;border:1px solid #181818;background:#0E0E0E;transition:border-color .2s; }
    .card:hover { border-color:#2A2A2A; }
    .card.sl { border-color:#282420; }
    .card.sl:hover { border-color:#3A342C; }
    .hdr { padding:14px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #141414; }
    .hdr.sl { background:linear-gradient(90deg,rgba(255,215,0,.04) 0%,transparent 60%);border-left:2px solid #C8A820; }
    .lbadge { font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:0.1em;padding:3px 8px;border-radius:4px;flex-shrink:0; }
    .tname { font-size:13px;font-weight:600;letter-spacing:-0.025em;color:#D8D8D8; }
    .star { font-size:9px;color:#C8A820;margin-left:6px;vertical-align:middle; }
    .tdesc { font-size:11px;color:#333;margin-left:auto; }
    .panels { display:grid;grid-template-columns:1fr 1fr; }
    .panel { padding:20px; }
    .panel+.panel { border-left:1px solid #141414; }
    .plabel { font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:0.14em;color:var(--ct);opacity:0.5;margin-bottom:14px; }

    /* mock app shell */
    .app { border-radius:10px;overflow:hidden;border:1px solid var(--bdr);background:var(--s0);box-shadow:0 8px 32px rgba(0,0,0,.4),0 0 0 .5px var(--bdr); }
    .topbar { height:44px;background:var(--sb);border-bottom:1px solid var(--bdr);display:flex;align-items:center;padding:0 14px;gap:12px; }
    .logo-mark { width:24px;height:24px;border-radius:6px;background:var(--acc);flex-shrink:0;display:flex;align-items:center;justify-content:center; }
    .logo-inner { width:10px;height:10px;border-radius:2px;background:var(--aptx);opacity:.8; }
    .app-name { font-size:12px;font-weight:600;color:var(--cp);letter-spacing:-0.02em; }
    .topbar-right { margin-left:auto;display:flex;align-items:center;gap:8px; }
    .pill { height:22px;padding:0 10px;border-radius:11px;background:var(--apbg);color:var(--aptx);font-size:9px;font-weight:700;display:flex;align-items:center;letter-spacing:0.02em; }
    .avatar { width:26px;height:26px;border-radius:50%;background:var(--acl);border:1.5px solid var(--acc);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center; }
    .avatar-i { font-size:10px;font-weight:700;color:var(--acc); }
    .shell { display:flex;height:200px; }
    .sidebar { width:130px;background:var(--sb);border-right:1px solid var(--bdr);padding:10px 6px;display:flex;flex-direction:column;gap:1px;flex-shrink:0; }
    .nav { padding:6px 10px;border-radius:6px;font-size:10px;color:var(--cs);display:flex;align-items:center;gap:6px; }
    .nav.on { background:var(--acl);color:var(--acc);font-weight:600; }
    .nav-dot { width:5px;height:5px;border-radius:50%;background:var(--acc);flex-shrink:0; }
    .nav-dot-g { width:5px;height:5px;border-radius:50%;background:var(--ct);opacity:.4;flex-shrink:0; }
    .content { flex:1;background:var(--bg);padding:12px;display:flex;flex-direction:column;gap:8px;overflow:hidden; }
    .metrics { display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px; }
    .metric { background:var(--s0);border:1px solid var(--bdr);border-radius:8px;padding:10px 10px 8px; }
    .m-label { font-size:8px;font-weight:500;color:var(--ct);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:4px; }
    .m-val { font-size:17px;font-weight:700;color:var(--cp);letter-spacing:-0.04em;line-height:1; }
    .m-trend { font-size:8px;color:var(--ok);margin-top:3px;font-weight:500; }
    .m-trend.neg { color:var(--er); }
    .chart-row { display:flex;gap:6px;flex:1;min-height:0; }
    .chart-card { flex:2;background:var(--s0);border:1px solid var(--bdr);border-radius:8px;padding:10px;overflow:hidden; }
    .chart-title { font-size:8px;font-weight:600;color:var(--cs);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.08em; }
    .bars { display:flex;align-items:flex-end;gap:3px;height:38px; }
    .bar { flex:1;border-radius:2px 2px 0 0;min-width:0; }
    .activity-card { flex:1;background:var(--s0);border:1px solid var(--bdr);border-radius:8px;padding:10px;overflow:hidden; }
    .act-row { display:flex;align-items:center;gap:6px;margin-bottom:5px; }
    .act-dot { width:6px;height:6px;border-radius:50%;flex-shrink:0; }
    .act-text { font-size:8px;color:var(--cs);white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }

    /* below-the-fold UI elements */
    .ui-row { margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start; }
    .btns { display:flex;gap:5px;flex-wrap:wrap; }
    .btn { padding:6px 13px;border-radius:6px;font-size:10px;font-weight:600;border:none;cursor:pointer;letter-spacing:-0.01em; }
    .bp { background:var(--apbg);color:var(--aptx); }
    .bs { background:var(--acl);color:var(--acc);border:1px solid var(--acc);border-opacity:.3; }
    .bg2 { background:transparent;color:var(--cs);border:1px solid var(--bdr); }
    .bdgs { display:flex;gap:4px;flex-wrap:wrap; }
    .bdg { padding:3px 7px;border-radius:4px;font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em; }

    /* palette strip */
    .palette { margin-top:14px;display:flex;gap:0;border-radius:6px;overflow:hidden;border:1px solid var(--bdr); }
    .pc { flex:1;height:28px; }
    .pc-labels { display:flex;gap:0;margin-top:3px; }
    .pc-l { flex:1;font-size:6px;color:var(--ct);text-align:center;opacity:.6; }
  </style>
</head>

    +'<div class="pc-l" style="color:var(--ct)">success</div>'
    +'<div class="pc-l" style="color:var(--ct)">warning</div>'
    +'<div class="pc-l" style="color:var(--ct)">error</div>'
    +'</div>';
}

const root = document.getElementById("root");
const groups = [
  { label:"Shortlisted", note:"B + E", ids:["b","e"] },
  { label:"B-Family", note:"Earthy / Natural / Green", ids:["b2","b3","b4","b5"] },
  { label:"E-Family", note:"Pastel / Soft / Dreamy", ids:["e2","e3","e4","e5"] },
];
groups.forEach(function(g) {
  var row = document.createElement("div");
  row.className = "group-row";
  row.innerHTML = '<div class="group-tag">'+g.label+'</div><div class="group-note">&#8212; '+g.note+'</div><div class="group-line"></div>';
  root.appendChild(row);
  var grid = document.createElement("div");
  grid.className = "grid";
  g.ids.forEach(function(id) {
    var t = T.find(function(x){ return x.id===id; });
    var sec = document.createElement("div");
    sec.className = "card"+(t.sl?" sl":"");
    var star = t.sl?'<span class="star">&#9733;</span>':"";
    sec.innerHTML =
      '<div class="hdr'+(t.sl?" sl":"")+'">'+
        '<span class="lbadge" style="background:'+t.bc+';color:'+t.bt+'">'+t.letter+'</span>'+
        '<span class="tname">'+t.name+star+'</span>'+
        '<span class="tdesc">'+t.desc+'</span>'+
      '</div>'+
      '<div class="panels">'+
        '<div class="panel" style="'+vars(t.dk)+'"><div class="plabel">Dark</div>'+ui(t.dk)+'</div>'+
        '<div class="panel" style="'+vars(t.lt)+'"><div class="plabel">Light</div>'+ui(t.lt)+'</div>'+
      '</div>';
    grid.appendChild(sec);
  });
  root.appendChild(grid);
});
</script>
</body>
</html>
