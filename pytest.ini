[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    integration: requires a live database or external service (skip in CI with -m "not integration")
filterwarnings =
    ignore::DeprecationWarning:temporalio
