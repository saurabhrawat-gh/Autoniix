# Ruff configuration for Autoniix monorepo
# See: https://docs.astral.sh/ruff/

target-version = "py312"
line-length = 120
indent-width = 4

[lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "T10",    # flake8-debugger
    "EM",     # flake8-errmsg
    "ISC",    # flake8-implicit-str-concat
    "ICN",    # flake8-import-conventions
    "PIE",    # flake8-pie
    "PT",     # flake8-pytest-style
    "Q",      # flake8-quotes
    "RSE",    # flake8-raise
    "RET",    # flake8-return
    "SIM",    # flake8-simplify
    "TID",    # flake8-tidy-imports
    "TCH",    # flake8-type-checking
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate (commented-out code)
    "PL",     # pylint
    "TRY",    # tryceratops
    "RUF",    # ruff-specific rules
]

ignore = [
    "E501",   # line too long (handled by formatter)
    "PLR0913", # too many arguments
    "PLR2004", # magic value comparison
    "TRY003",  # long exception message
    "EM101",   # exception must not use string literal
    "EM102",   # exception must not use f-string literal
]

[lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__.py are OK
"tests/**/*.py" = ["ARG001", "PLR2004", "S101"]  # test files can have unused args, magic values, asserts
"scripts/**/*.py" = ["T201"]  # scripts can use print()

[lint.isort]
known-first-party = ["core", "schemas", "services_api", "temporal_workers", "providers", "intelligence", "observability"]
combine-as-imports = true

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
