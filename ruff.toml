# Ruff configuration for Autoniix monorepo (Phase 7)
# See: https://docs.astral.sh/ruff/
#
# TWO-TIER LINT STRATEGY:
#   • `[lint] select`: BLOCKING rules that gate the harness. Small, safe,
#     mostly auto-fixable. Any violation fails `make lint` and CI.
#   • `[lint.extend-select]` behind Makefile `lint-strict`: ASPIRATIONAL rules
#     (naming, complexity, tryceratops, ...). Currently advisory. Ratchet
#     these in one rule at a time as the codebase is cleaned up. Track
#     progress in docs/architecture/adr-005-harness-and-parity.md.

target-version = "py312"
line-length = 120
indent-width = 4

[lint]
# BLOCKING rules — MUST stay green. Enforced by `make lint` + CI.
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes (undefined names, unused imports, etc.)
    "I",      # isort
]

# Aspirational rules for future ratcheting are NOT selected here to keep the
# blocking baseline safe. To run them advisorily, use `ruff check --select
# N,UP,B,C4,DTZ,T10,EM,ISC,ICN,PIE,PT,Q,RSE,RET,SIM,TID,TCH,ARG,PTH,ERA,PL,TRY,RUF .`
# or `make lint-strict` (Makefile target, non-blocking).

ignore = [
    "E501",   # line too long (handled by formatter)
    "E402",   # module import not at top of file (many scripts rely on sys.path setup)
]

[lint.per-file-ignores]
"__init__.py"     = ["F401"]  # unused imports in __init__ are OK
"tests/**/*.py"   = ["ARG001", "PLR2004", "S101", "F841", "F402"]
"scripts/**/*.py" = ["T201", "F841", "E741"]
# WIP file with in-flight edits — see harness-completion PR notes.
"backend/api/core/research/main.py" = ["F821", "F841"]
# Legacy F841 (dead assignments). TODO: clean up incrementally, then remove.
# These are non-behavioural — they don't hide bugs, just leftover debug state.
"backend/api/core/analytics/main.py"                    = ["F841"]
"backend/api/core/direction/main.py"                    = ["F841"]
"backend/api/core/experiments/ab_framework.py"          = ["F841"]
"backend/api/core/research/burst_detector.py"           = ["F841"]
"backend/api/core/script/retention_optimizer.py"        = ["F841"]
"backend/api/core/script/script_analyzer.py"            = ["F841"]
"backend/api/core/voice/voice_style_learner.py"         = ["F841"]
"backend/platform/sentry-agent/jira_client.py"          = ["F841"]
"shared/python/intelligence/system_health.py"           = ["F841"]
"shared/python/providers/image/placeholder_provider.py" = ["F841"]
"shared/python/providers/registry.py"                   = ["F841"]

[lint.isort]
known-first-party = ["core", "schemas", "services_api", "temporal_workers", "providers", "intelligence", "observability"]
combine-as-imports = true

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
