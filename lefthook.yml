# Lefthook configuration for Autoniix
# See: https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  commands:
    # Python: format + lint
    ruff-format:
      glob: "*.py"
      run: ruff format {staged_files}
      stage_fixed: true
    
    ruff-check:
      glob: "*.py"
      run: ruff check --fix {staged_files}
      stage_fixed: true
    
    # TypeScript: format + lint
    prettier:
      glob: "*.{ts,tsx,js,jsx,json,md,yml,yaml}"
      run: npx prettier --write {staged_files}
      stage_fixed: true
    
    eslint:
      glob: "*.{ts,tsx,js,jsx}"
      run: npx eslint --fix {staged_files}
      stage_fixed: true

pre-push:
  commands:
    # Type checks
    python-types:
      run: |
        echo "🔍 Running Python type checks..."
        mypy libs/python/ || true
        basedpyright services/ || true
    
    typescript-types:
      run: |
        echo "🔍 Running TypeScript type checks..."
        cd libs/ts/contracts && npm run typecheck
        cd services/gateway-v2 && npm run typecheck
        cd services/streaming-hub-v2 && npm run typecheck
    
    # Tests (fast unit tests only)
    python-tests:
      run: |
        echo "🧪 Running Python tests..."
        pytest tests/ -x --tb=short || true
    
    typescript-tests:
      run: |
        echo "🧪 Running TypeScript tests..."
        cd services/streaming-hub-v2 && npm test || true
