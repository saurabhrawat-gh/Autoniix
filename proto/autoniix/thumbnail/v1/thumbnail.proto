syntax = "proto3";

package autoniix.thumbnail.v1;

import "autoniix/common/v1/common.proto";

service ThumbnailService {
  rpc GenerateThumbnail(GenerateThumbnailRequest) returns (GenerateThumbnailResponse);
  rpc GetThumbnailFeedback(ThumbnailFeedbackRequest) returns (common.v1.Empty);
  rpc TrainModel(ThumbnailTrainRequest) returns (ThumbnailTrainResponse);
}

message GenerateThumbnailRequest {
  string content_id = 1;
  string channel_id = 2;
  string title = 3;
  string niche = 4;
  string content_mode = 5;
  map<string, string> parameters = 6;
}

message GenerateThumbnailResponse {
  ThumbnailVariant selected_thumbnail = 1;
  repeated ThumbnailVariant all_variants = 2;
  double thumbnail_score = 3;
  double thumbnail_ctr_prediction = 4;
  int32 concepts_generated = 5;
  double cost_usd = 6;
}

message ThumbnailVariant {
  int32 variant_id = 1;
  string concept_name = 2;
  string url = 3;
  double predicted_ctr = 4;
  double thumbnail_score = 5;
  string text_overlay = 6;
  string dall_e_prompt = 7;
}

message ThumbnailFeedbackRequest {
  string content_id = 1;
  string channel_id = 2;
  double actual_ctr = 3;
  int32 impressions = 4;
}

message ThumbnailTrainRequest {
  string niche = 1;
}

message ThumbnailTrainResponse {
  bool success = 1;
  string message = 2;
}
