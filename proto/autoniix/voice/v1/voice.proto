syntax = "proto3";

package autoniix.voice.v1;

import "autoniix/common/v1/common.proto";

service VoiceService {
  rpc SynthesizeVoice(SynthesizeVoiceRequest) returns (SynthesizeVoiceResponse);
  rpc ListVoiceModels(ListVoiceModelsRequest) returns (ListVoiceModelsResponse);
  rpc GetVoiceAudio(GetVoiceAudioRequest) returns (GetVoiceAudioResponse);
}

message SynthesizeVoiceRequest {
  string script_id = 1;
  string text = 2;
  string voice_model_id = 3;
  string channel_id = 4;
  VoiceSettings settings = 5;
}

message SynthesizeVoiceResponse {
  string audio_id = 1;
  string audio_url = 2;
  int32 duration_ms = 3;
  double generation_cost = 4;
}

message ListVoiceModelsRequest {
  string provider = 1;
  string language = 2;
}

message ListVoiceModelsResponse {
  repeated VoiceModel models = 1;
}

message GetVoiceAudioRequest {
  string audio_id = 1;
}

message GetVoiceAudioResponse {
  bytes audio_data = 1;
  string format = 2;
  int32 sample_rate = 3;
}

message VoiceModel {
  string id = 1;
  string name = 2;
  string provider = 3;
  string language = 4;
  string gender = 5;
  repeated string styles = 6;
  double cost_per_character = 7;
}

message VoiceSettings {
  double speed = 1;
  double pitch = 2;
  double stability = 3;
  double similarity_boost = 4;
  string style = 5;
}
