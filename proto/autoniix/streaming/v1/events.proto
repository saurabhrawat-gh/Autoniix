syntax = "proto3";

package autoniix.streaming.v1;

import "autoniix/common/v1/common.proto";
import "google/protobuf/timestamp.proto";

service EventStreamService {
  rpc Subscribe(SubscribeRequest) returns (stream Event);
  rpc Publish(PublishRequest) returns (common.v1.Empty);
  rpc Acknowledge(AcknowledgeRequest) returns (common.v1.Empty);
}

message SubscribeRequest {
  string workspace_id = 1;
  repeated string event_types = 2;
  string last_event_id = 3;
  bool replay_from_last = 4;
}

message PublishRequest {
  Event event = 1;
}

message AcknowledgeRequest {
  string event_id = 1;
  string subscriber_id = 2;
}

message Event {
  string id = 1;
  string type = 2;
  string workspace_id = 3;
  google.protobuf.Timestamp timestamp = 4;
  oneof payload {
    JobEvent job_event = 5;
    VideoEvent video_event = 6;
    SystemEvent system_event = 7;
    NotificationEvent notification_event = 8;
  }
}

message JobEvent {
  string job_id = 1;
  common.v1.JobStatus status = 2;
  string stage = 3;
  double progress_percent = 4;
  string message = 5;
}

message VideoEvent {
  string video_id = 1;
  string action = 2;
  map<string, string> metadata = 3;
}

message SystemEvent {
  string component = 1;
  string level = 2;
  string message = 3;
  map<string, string> details = 4;
}

message NotificationEvent {
  string title = 1;
  string message = 2;
  string severity = 3;
  string action_url = 4;
}
