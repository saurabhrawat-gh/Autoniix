syntax = "proto3";

package autoniix.gateway.v1;

import "autoniix/common/v1/common.proto";
import "google/protobuf/timestamp.proto";

service JobService {
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);
  rpc GetJob(GetJobRequest) returns (GetJobResponse);
  rpc CreateJob(CreateJobRequest) returns (CreateJobResponse);
  rpc UpdateJob(UpdateJobRequest) returns (UpdateJobResponse);
  rpc DeleteJob(DeleteJobRequest) returns (common.v1.Empty);
  rpc PauseJob(PauseJobRequest) returns (common.v1.Empty);
  rpc ResumeJob(ResumeJobRequest) returns (common.v1.Empty);
  rpc RetryJob(RetryJobRequest) returns (common.v1.Empty);
  rpc StreamJobProgress(StreamJobProgressRequest) returns (stream JobProgressEvent);
}

message ListJobsRequest {
  string workspace_id = 1;
  common.v1.PaginationRequest pagination = 2;
  repeated common.v1.JobStatus status_filter = 3;
  common.v1.TimeRange time_range = 4;
  string sort_by = 5;
  bool sort_desc = 6;
}

message ListJobsResponse {
  repeated Job jobs = 1;
  common.v1.PaginationResponse pagination = 2;
}

message GetJobRequest {
  string job_id = 1;
}

message GetJobResponse {
  Job job = 1;
}

message CreateJobRequest {
  string workspace_id = 1;
  string channel_id = 2;
  JobConfig config = 3;
}

message CreateJobResponse {
  Job job = 1;
}

message UpdateJobRequest {
  string job_id = 1;
  JobConfig config = 2;
}

message UpdateJobResponse {
  Job job = 1;
}

message DeleteJobRequest {
  string job_id = 1;
}

message PauseJobRequest {
  string job_id = 1;
}

message ResumeJobRequest {
  string job_id = 1;
}

message RetryJobRequest {
  string job_id = 1;
}

message StreamJobProgressRequest {
  string job_id = 1;
}

message Job {
  string id = 1;
  string workspace_id = 2;
  string channel_id = 3;
  common.v1.JobStatus status = 4;
  JobConfig config = 5;
  JobProgress progress = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  google.protobuf.Timestamp completed_at = 9;
  string error_message = 10;
}

message JobConfig {
  int32 num_videos = 1;
  string niche = 2;
  bool auto_publish = 3;
  map<string, string> parameters = 4;
}

message JobProgress {
  int32 total_videos = 1;
  int32 completed_videos = 2;
  int32 failed_videos = 3;
  string current_stage = 4;
  double progress_percent = 5;
  google.protobuf.Timestamp started_at = 6;
  google.protobuf.Timestamp estimated_completion = 7;
}

message JobProgressEvent {
  string job_id = 1;
  common.v1.JobStatus status = 2;
  JobProgress progress = 3;
  string stage = 4;
  string message = 5;
  google.protobuf.Timestamp timestamp = 6;
}
