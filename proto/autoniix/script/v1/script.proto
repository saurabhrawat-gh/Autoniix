syntax = "proto3";

package autoniix.script.v1;

import "autoniix/common/v1/common.proto";

service ScriptService {
  rpc GenerateScript(GenerateScriptRequest) returns (GenerateScriptResponse);
  rpc ExpandScript(ExpandScriptRequest) returns (ExpandScriptResponse);
  rpc ValidateScript(ValidateScriptRequest) returns (ValidateScriptResponse);
  rpc GetScriptHistory(GetScriptHistoryRequest) returns (GetScriptHistoryResponse);
}

message GenerateScriptRequest {
  string topic = 1;
  string niche = 2;
  string channel_id = 3;
  int32 target_duration_seconds = 4;
  string style = 5;
  map<string, string> parameters = 6;
}

message GenerateScriptResponse {
  Script script = 1;
  double generation_cost = 2;
  int32 generation_time_ms = 3;
}

message ExpandScriptRequest {
  string script_id = 1;
  string outline = 2;
  string channel_id = 3;
  map<string, string> parameters = 4;
}

message ExpandScriptResponse {
  Script script = 1;
}

message ValidateScriptRequest {
  string script_id = 1;
  string content = 2;
}

message ValidateScriptResponse {
  bool valid = 1;
  repeated ValidationIssue issues = 2;
  double quality_score = 3;
}

message GetScriptHistoryRequest {
  string channel_id = 1;
  common.v1.PaginationRequest pagination = 2;
}

message GetScriptHistoryResponse {
  repeated Script scripts = 1;
  common.v1.PaginationResponse pagination = 2;
}

message Script {
  string id = 1;
  string topic = 2;
  string content = 3;
  repeated ScriptSegment segments = 4;
  int32 duration_seconds = 5;
  int32 word_count = 6;
  string style = 7;
  common.v1.ResourceMetadata metadata = 8;
}

message ScriptSegment {
  int32 index = 1;
  string text = 2;
  int32 start_time_ms = 3;
  int32 end_time_ms = 4;
  string scene_type = 5;
}

message ValidationIssue {
  string type = 1;
  string message = 2;
  string severity = 3;
  int32 line_number = 4;
}
