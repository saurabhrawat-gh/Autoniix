syntax = "proto3";

package autoniix.research.v1;

import "autoniix/common/v1/common.proto";
import "google/protobuf/timestamp.proto";

service ResearchService {
  rpc DiscoverTopics(DiscoverTopicsRequest) returns (DiscoverTopicsResponse);
  rpc SelectTopic(SelectTopicRequest) returns (SelectTopicResponse);
  rpc CheckSimilarity(CheckSimilarityRequest) returns (CheckSimilarityResponse);
  rpc CalculateSaturation(CalculateSaturationRequest) returns (CalculateSaturationResponse);
  rpc GetCompetitorInsights(GetCompetitorInsightsRequest) returns (GetCompetitorInsightsResponse);
}

message DiscoverTopicsRequest {
  string niche = 1;
  string channel_id = 2;
  int32 count = 3;
  map<string, string> constraints = 4;
}

message DiscoverTopicsResponse {
  repeated Topic topics = 1;
  BanditState bandit_state = 2;
}

message SelectTopicRequest {
  string niche = 1;
  repeated string candidate_topics = 2;
  string channel_id = 3;
}

message SelectTopicResponse {
  Topic selected_topic = 1;
  string selection_reason = 2;
  BanditState bandit_state = 3;
}

message CheckSimilarityRequest {
  string text = 1;
  string channel_id = 2;
  string text_type = 3;
  int32 top_k = 4;
}

message CheckSimilarityResponse {
  bool is_duplicate = 1;
  repeated SimilarityMatch matches = 2;
}

message CalculateSaturationRequest {
  string topic = 1;
  string niche = 2;
  string channel_id = 3;
}

message CalculateSaturationResponse {
  double saturation_score = 1;
  int32 competitor_count = 2;
  repeated CompetitorVideo top_competitors = 3;
}

message GetCompetitorInsightsRequest {
  string niche = 1;
  int32 limit = 2;
}

message GetCompetitorInsightsResponse {
  repeated CompetitorVideo videos = 1;
  google.protobuf.Timestamp last_updated = 2;
}

message Topic {
  string id = 1;
  string text = 2;
  string cluster = 3;
  double score = 4;
  double saturation_score = 5;
  repeated string keywords = 6;
  google.protobuf.Timestamp created_at = 7;
}

message BanditState {
  map<string, ArmState> arms = 1;
  int32 total_pulls = 2;
  google.protobuf.Timestamp last_updated = 3;
}

message ArmState {
  double alpha = 1;
  double beta = 2;
  int32 pulls = 3;
  int32 successes = 4;
}

message SimilarityMatch {
  string id = 1;
  string text = 2;
  double cosine_similarity = 3;
  int32 hamming_distance = 4;
  google.protobuf.Timestamp created_at = 5;
}

message CompetitorVideo {
  string video_id = 1;
  string title = 2;
  string channel_id = 3;
  int64 view_count = 4;
  double engagement_rate = 5;
  google.protobuf.Timestamp published_at = 6;
  repeated double embedding = 7;
}
